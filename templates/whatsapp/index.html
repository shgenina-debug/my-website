<title>رسائل واتساب للعملاء</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: one column of message cards under a sticky search + category bar; RTL, phone-first */
:root{
  --bg:#eef3f2; --surface:#ffffff; --ink:#132225; --muted:#5b6d70; --line:#d5e0df;
  --accent:#0b6f6a; --accent-ink:#ffffff; --bubble:#e3f4ec; --ph-bg:#fff1c9; --ph-ink:#6b4a00; --opt:#7a6f9c;
  --font:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1719; --surface:#152225; --ink:#e3eeed; --muted:#93a7a9; --line:#26393c;
  --accent:#3fb8a8; --accent-ink:#06201d; --bubble:#173a33; --ph-bg:#4a3a0e; --ph-ink:#ffd978; --opt:#b3a7dd; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1719; --surface:#152225; --ink:#e3eeed; --muted:#93a7a9; --line:#26393c;
  --accent:#3fb8a8; --accent-ink:#06201d; --bubble:#173a33; --ph-bg:#4a3a0e; --ph-ink:#ffd978; --opt:#b3a7dd; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto}
header.top{padding-block:20px 8px}
h1{font-size:1.45rem;margin:0;font-weight:700;text-wrap:balance}
.sub{color:var(--muted);margin:2px 0 0;font-size:.9rem}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.search{width:100%;font:inherit;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.search:focus,.chip:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface);gap:2px}
.lang button{font:inherit;font-size:.85rem;border:0;background:none;color:var(--ink);padding:4px 14px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.toprow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:5px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip .n{opacity:.7;font-size:.75rem;margin-inline-start:4px}
details.me{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-block:14px 4px}
details.me summary{cursor:pointer;padding:12px 14px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:8px}
details.me summary::after{content:"▾";color:var(--muted)}
details.me[open] summary::after{content:"▴"}
.me .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;padding:0 14px 14px}
.me label{display:grid;gap:3px;font-size:.82rem;color:var(--muted)}
.me input[type=text]{font:inherit;font-size:.95rem;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-width:0}
.toggle{display:flex;align-items:center;gap:8px;padding:0 14px 14px;font-size:.88rem}
.note{font-size:.8rem;color:var(--muted);padding:0 14px 14px;margin:0}
h2{font-size:1.05rem;margin:26px 0 10px;color:var(--accent);font-weight:700}
.list{display:grid;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:10px;min-width:0}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.head h3{margin:0;font-size:.98rem;font-weight:600;min-width:0;text-wrap:balance}
.num{color:var(--muted);font-variant-numeric:tabular-nums;font-weight:500;margin-inline-end:6px}
.copy{flex:none;font:inherit;font-size:.88rem;font-weight:600;border:0;border-radius:9px;padding:7px 14px;background:var(--accent);color:var(--accent-ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:36px}
.copy.done{background:var(--ink);color:var(--surface)}
.copy svg{width:16px;height:16px}
.bubble{background:var(--bubble);border-radius:12px 4px 12px 12px;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:.93rem;line-height:1.75;min-width:0}
.ph{background:var(--ph-bg);color:var(--ph-ink);border-radius:4px;padding:0 3px;font-size:.88em;font-weight:500}
.filled{border-bottom:1.5px dotted var(--accent)}
.optl{color:var(--opt)}
.empty{text-align:center;color:var(--muted);padding:40px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:9px 18px;border-radius:999px;font-size:.9rem;opacity:0;transition:.2s;pointer-events:none;z-index:20}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sel{position:fixed;opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
<div class="wrap" dir="rtl" lang="ar">
  <header class="top">
    <div class="toprow"><h1>رسائل واتساب للعملاء</h1>
    <div class="lang" role="group" aria-label="لغة الرسائل"><button type="button" id="l-ar" lang="ar">عربي</button><button type="button" id="l-en" lang="en">English</button></div></div>
    <p class="sub">الغازات الطبية والصناعية • صيانة أجهزة المختبرات • المعايرة — اضغط «نسخ» وألصقها في الواتساب على طول<br>للعملاء الأجانب: اختر English فوق.</p>
  </header>
  <details class="me" id="me">
    <summary>بياناتي (تُعبّأ في الرسائل تلقائياً)</summary>
    <div class="grid">
      <label>اسم الشركة<input type="text" id="f-company" data-k="اسم_الشركة"></label>
      <label>اسم الموظف<input type="text" id="f-emp" data-k="اسم_الموظف"></label>
      <label>رقم التواصل<input type="text" id="f-phone" data-k="رقم_التواصل" inputmode="tel"></label>
      <label>رقم الطوارئ<input type="text" id="f-emg" data-k="رقم_الطوارئ" inputmode="tel"></label>
      <label>الموقع الإلكتروني<input type="text" id="f-web" data-k="الموقع_الإلكتروني"></label>
      <label>اسم العميل (للرسالة الحالية)<input type="text" id="f-client" data-k="اسم_العميل"></label>
    </div>
    <label class="toggle"><input type="checkbox" id="f-opt"> حذف الأسطر الاختيارية [اختياري / Optional] عند النسخ</label>
    <p class="note">البيانات تُحفظ على جهازك فقط. الحقول المظللة بالأصفر تبقى في الرسالة لتعديلها يدوياً قبل الإرسال.</p>
  </details>
  <div class="bar">
    <input class="search" id="q" type="search" placeholder="ابحث: معايرة، تسريب، عرض سعر…" aria-label="بحث في الرسائل">
    <div class="chips" id="chips" role="toolbar" aria-label="الأقسام"></div>
  </div>
  <main id="out"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<textarea class="sel" id="sel" aria-hidden="true" tabindex="-1"></textarea>
<script>
const DATA={"ar": [{"name": "رسائل عامة", "items": [{"t": "ترحيب وتعريف بالشركة (أول تواصل)", "b": "السلام عليكم ورحمة الله وبركاته\nحياك الله {{اسم_العميل}} 🌿\n\nمعك {{اسم_الموظف}} من *{{اسم_الشركة}}*\nخدماتنا:\n▫️ تمديد وصيانة شبكات *الغازات الطبية* (أكسجين، هواء طبي، شفط، أكسيد النيتروز، ثاني أكسيد الكربون)\n▫️ تمديد وصيانة شبكات *الغازات الصناعية* والمختبرية (نيتروجين، أرجون، هيليوم، هواء مضغوط وغيرها)\n▫️ *صيانة أجهزة المختبرات* الدورية والطارئة\n▫️ *معايرة الأجهزة* مع شهادات المعايرة\n\nتشرفنا خدمتكم، وش احتياجكم بالضبط عشان أحولك على المختص؟\n📞 {{رقم_التواصل}}"}, {"t": "رد خارج أوقات الدوام (رد آلي)", "b": "حياك الله، وشكراً لتواصلك مع *{{اسم_الشركة}}* 🙏\nدوامنا: {{أيام_الدوام}} من {{من_الساعة}} إلى {{إلى_الساعة}}\nوبنرد عليك أول ما يبدأ الدوام بإذن الله.\n\n🚨 إذا عندك *عطل طارئ* في شبكة الغازات الطبية أو جهاز مهم، كلمنا على رقم الطوارئ: {{رقم_الطوارئ}}"}, {"t": "استلام طلب وجمع البيانات", "b": "أبشر {{اسم_العميل}}، وصلنا طلبك ✅\nعشان نجهز لك عرض سعر مضبوط، نحتاج منك:\n1️⃣ اسم الجهة والمدينة أو الموقع\n2️⃣ نوع الخدمة: (تمديد / صيانة / معايرة)\n3️⃣ قائمة الأجهزة أو نقاط الغاز (النوع، الشركة المصنعة، الموديل، العدد)\n4️⃣ تبون عقد سنوي ولا زيارة وحدة؟\n5️⃣ أي مخططات أو صور عندكم\n\nأرسلها هنا على طول 📎"}, {"t": "حجز زيارة معاينة للموقع", "b": "هلا {{اسم_العميل}}\nتم تأكيد *زيارة المعاينة* ✅\n📅 التاريخ: {{التاريخ}}\n⏰ الوقت: {{الوقت}}\n📍 الموقع: {{الموقع}}\n👷 المهندس: {{اسم_المهندس}} – {{جوال_المهندس}}\n\nنتمنى تسهلون دخولنا للموقع، ويكون معنا أحد من طرفكم إذا تيسر.\nوإذا تبي تغيّر الموعد علمنا قبلها بيوم الله يعافيك 🙏"}, {"t": "إرسال عرض السعر", "b": "هلا {{اسم_العميل}}\nمرفق لكم *عرض السعر رقم {{رقم_العرض}}* لـ: {{وصف_الخدمة}} 📄\n\n▫️ الإجمالي: {{المبلغ}} ريال {{شامل/غير_شامل}} ضريبة القيمة المضافة\n▫️ مدة التنفيذ: {{المدة}}\n▫️ العرض ساري لمدة: {{مدة_الصلاحية}}\n\nأي استفسار أو تعديل أنا حاضر، ونتشرف بخدمتكم 🤝"}, {"t": "متابعة عرض سعر (بعد 3–5 أيام)", "b": "مساء الخير {{اسم_العميل}} 🌷\nحبيت أطمن وأتابع معكم بخصوص عرض السعر رقم {{رقم_العرض}} اللي أرسلناه بتاريخ {{التاريخ}}.\nعندكم أي ملاحظة أو بند تبون توضيحه؟\nونقدر نرتب اجتماع سريع أو زيارة إذا يناسبكم."}, {"t": "تذكير بالسداد (بأسلوب لطيف)", "b": "السلام عليكم {{اسم_العميل}}، عساكم بخير\nنذكركم بالفاتورة رقم *{{رقم_الفاتورة}}* بمبلغ {{المبلغ}} ريال، ومستحقة بتاريخ {{تاريخ_الاستحقاق}}.\n📎 مرفق نسخة من الفاتورة.\nوإذا تم السداد نرجو ترسلون لنا صورة الحوالة، وشاكرين لكم تعاونكم 🙏"}, {"t": "استبيان رضا بعد الخدمة", "b": "يعطيكم العافية {{اسم_العميل}}، وشكراً على ثقتكم بـ *{{اسم_الشركة}}* 🙏\nرأيكم يهمنا في خدمة {{وصف_الخدمة}}:\n⭐ من 1 إلى 5، كم تعطي الخدمة؟\n💬 وش أكثر شي عجبك؟ ووش اللي نقدر نحسنه؟"}]}, {"name": "الغازات الطبية", "items": [{"t": "تعريف بخدمات الغازات الطبية (للمستشفيات والمراكز والعيادات)", "b": "السلام عليكم {{اسم_العميل}}\n*{{اسم_الشركة}}* تقدم لكم حلول متكاملة لأنظمة الغازات الطبية:\n\n🔹 تصميم وتمديد الشبكات بأنابيب النحاس الطبي المنظف لخدمة الأكسجين\n🔹 توريد وتركيب مخارج الغاز ولوحات الإنذار وصناديق المحابس للأقسام\n🔹 غرف التوزيع (المانيفولد) ومحطات الهواء الطبي والشفط\n🔹 الاختبارات والتشغيل: اختبار الضغط والتسريب، تنظيف الخطوط بالنيتروجين، فحص النقاء والتأكد من عدم تداخل الغازات بين المخارج\n🔹 عقود صيانة دورية وطارئة\n\n[اختياري: نشتغل حسب المواصفات المعتمدة: {{المواصفات_المعتمدة_لدينا}}]\n[اختياري: {{تراخيص/تأهيل الشركة لدى الجهات الصحية}}]\n\nتحبون نرتب لكم زيارة معاينة مجانية؟"}, {"t": "تأكيد موعد صيانة دورية للغازات الطبية", "b": "هلا {{اسم_العميل}}\nنذكركم بموعد *الصيانة الدورية لشبكة الغازات الطبية* – {{اسم_المنشأة}} 🏥\n📅 {{التاريخ}} ⏰ {{الوقت}}\n👷 الفريق: {{اسم_الفني}} – {{جوال_الفني}}\n\nالزيارة تشمل: فحص المانيفولد ومنظمات الضغط، لوحات الإنذار، صناديق المحابس، المخارج، ضواغط الهواء الطبي ومضخات الشفط، وفحص التسريب.\n\n⚠️ ممكن نحتاج نوقف بعض الأقسام وقت قصير، وبننسق مع التمريض وإدارة الصيانة قبل أي إيقاف، وما نسكر أي محبس إلا بموافقتكم."}, {"t": "استلام بلاغ عطل طارئ (غازات طبية)", "b": "وصلنا بلاغك وأبشر بالسعد 🚨\nرقم البلاغ: *{{رقم_البلاغ}}*\nالعطل: {{وصف_العطل}}\nالموقع: {{القسم/الدور}}\n\n👷 الفني {{اسم_الفني}} متحرك لكم الحين، ويوصل خلال {{المدة}} تقريباً.\n📞 للتواصل المباشر: {{جوال_الفني}}\n\n⚠️ لين نوصل: الله يعافيكم لا أحد يفك أو يعدّل أي جزء في الشبكة، واعتمدوا على الأسطوانات الاحتياطية حسب إجراءات المنشأة."}, {"t": "إنجاز أعمال تمديد واختبار (تسليم)", "b": "هلا {{اسم_العميل}}\nيسعدنا نبلغكم إنه تم *إنجاز تمديد شبكة الغازات الطبية* في {{الموقع}} ✅\n\nاللي تم:\n✔️ اختبار الضغط والتسريب\n✔️ تنظيف الخطوط بالنيتروجين\n✔️ التأكد من مطابقة كل مخرج لغازه وعدم التداخل\n✔️ فحص النقاء [اختياري حسب العقد]\n✔️ تشغيل واختبار لوحات الإنذار\n\n📎 مرفق تقرير الاختبارات ومحضر التسليم.\nونقترح نحدد موعد ندرّب فيه فريقكم على لوحات الإنذار ومحابس الطوارئ."}, {"t": "تذكير بانتهاء عقد الصيانة وتجديده", "b": "السلام عليكم {{اسم_العميل}}\nعقد صيانة *{{نوع_النظام}}* رقم {{رقم_العقد}} ينتهي بتاريخ *{{تاريخ_الانتهاء}}* 📅\n\nوعشان تستمر الخدمة بدون انقطاع، نقترح نجدد العقد.\n📎 مرفق عرض التجديد، ويشمل: {{عدد_الزيارات}} زيارة دورية + الاستجابة للأعطال خلال {{زمن_الاستجابة}}.\n\nونتشرف نكمل معكم سنة جديدة 🤝"}]}, {"name": "الغازات الصناعية والمختبرية", "items": [{"t": "تعريف بخدمات الغازات الصناعية (مصانع، مختبرات، ورش)", "b": "السلام عليكم {{اسم_العميل}}\nفي *{{اسم_الشركة}}* نمدد ونصون شبكات الغازات الصناعية والمختبرية:\n\n🔸 الغازات: نيتروجين، أرجون، أكسجين، ثاني أكسيد الكربون، هيليوم، هيدروجين، أسيتيلين، هواء مضغوط، والخلطات\n🔸 الأنابيب: ستانلس ستيل أو نحاس، حسب نوع الغاز ودرجة النقاء المطلوبة\n🔸 غرف ومنصات الأسطوانات، منظمات الضغط، محابس الإغلاق، وأجهزة كشف التسريب\n🔸 خطوط الغاز لأجهزة التحليل والغازات عالية النقاء\n🔸 اختبار الضغط والتسريب والتشغيل والصيانة الدورية\n\nأرسلوا لنا المخطط أو قائمة الأجهزة ونرتب لكم المعاينة وعرض السعر."}, {"t": "تقرير زيارة صيانة شبكة غازات", "b": "هلا {{اسم_العميل}}\nتمت زيارة الصيانة لشبكة الغازات في {{الموقع}} بتاريخ {{التاريخ}} ✅\n\n📋 *ملخص النتائج:*\n▫️ الحالة العامة: {{سليمة / تحتاج إجراء}}\n▫️ التسريبات: {{ما فيه / العدد والمكان}}\n▫️ المنظمات والمحابس: {{الحالة}}\n▫️ اللي سويناه في الموقع: {{الإجراءات}}\n\n⚠️ *التوصيات:* {{التوصيات}}\n📎 التقرير الكامل مرفق."}, {"t": "تنبيه سلامة بعد اكتشاف ible have a member of your team available.\nIf you need to reschedule, kindly let us know a day in advance 🙏"}, {"t": "Sending the quotation", "b": "Hello {{client_name}},\nPlease find attached *Quotation No. {{quote_number}}* for: {{service_description}} 📄\n\n▫️ Total: SAR {{amount}} {{incl./excl.}} VAT\n▫️ Delivery period: {{duration}}\n▫️ Valid for: {{validity}}\n\nI'm happy to answer any questions or make adjustments. We look forward to working with you 🤝"}, {"t": "Quotation follow-up (after 3–5 days)", "b": "Good afternoon {{client_name}},\nJust following up on Quotation No. {{quote_number}} sent on {{date}}.\nDo you have any comments, or would you like clarification on any item?\nWe can also arrange a short call or a site visit if that suits you."}, {"t": "Payment reminder (polite)", "b": "Dear {{client_name}},\nA friendly reminder that Invoice No. *{{invoice_number}}* for SAR {{amount}} is due on {{due_date}}.\n📎 A copy of the invoice is attached.\nIf payment has already been made, please share the transfer receipt. Thank you for your cooperation 🙏"}, {"t": "Customer satisfaction survey", "b": "Thank you {{client_name}} for choosing *{{company_name}}* 🙏\nYour feedback on our {{service_description}} matters to us:\n⭐ On a scale of 1 to 5, how would you rate the service?\n💬 What did you like most, and what could we do better?"}]}, {"name": "Medical Gases", "items": [{"t": "Medical gas services introduction (hospitals, medical centres, clinics)", "b": "Dear {{client_name}},\n*{{company_name}}* provides complete medical gas pipeline solutions:\n\n🔹 Design and installation using cleaned-for-oxygen medical-grade copper pipe\n🔹 Supply and installation of gas outlets, area alarm panels and zone valve boxes\n🔹 Manifold rooms, medical air plants and vacuum plants\n🔹 Testing and commissioning: pressure and leak testing, purging, purity testing and cross-connection checks\n🔹 Preventive and emergency maintenance contracts\n\n[Optional: We work to {{standards_we_follow}}]\ {{visit_count}} preventive visits + breakdown response within {{response_time}}.\n\nWe'd be glad to continue serving you for another year 🤝"}]}, {"name": "Industrial and Laboratory Gases", "items": [{"t": "Industrial gas services introduction (factories, laboratories, workshops)", "b": "Dear {{client_name}},\n*{{company_name}}* installs and maintains industrial and laboratory gas systems:\n\n🔸 Gases: nitrogen, argon, oxygen, CO₂, helium, hydrogen, acetylene, compressed air and gas mixtures\n🔸 Piping: stainless steel or copper, depending on the gas and the required purity\n🔸 Cylinder manifolds, pressure regulators, isolation valves and gas leak detectors\n🔸 Gas lines for analytical instruments and high-purity gas systems\n🔸 Pressure and leak testing, commissioning and preventive maintenance\n\nSend us your drawings or equipment list and we'll arrange a site survey and quotation."}, {"t": "Gas system maintenance visit report", "b": "Hello {{client_name}},\nThe maintenance visit for the gas system at {{location}} was completed on {{date}} ✅\n\n📋 *Summary:*\n▫️ Overall condition: {{good / action required}}\n▫️ Leaks: {{none / number and location}}\n▫️ Regulators and valves: {{condition}}\n▫️ Work done on site: {{actions}}\n\n⚠️ *Recommendations:* {{recommendations}}\n📎 Full report attached."}, {"t": "Safety alert – leak detected", "b": "⚠️ *Safety alert – {{facility_name}}*\nDuring inspection we found a *leak* on the {{gas_type}} line at {{location}}.\n\nAction taken: {{line isolated / temporary repair}}\nRequired: {{permanent repair / part replacement}} – quotation to follow within {{duration}}.\n\nPlease do not reopen the isolated valve before coordinating with us.\nContact: {{engineer_name}} – {{engineer_mobile}}"}]}, {"name": "Laboratory Equipment Maintenance", "items": [{"t": "Laboratory equipment maintenance introduction", "b": "Dear {{client_name}},\n*{{company_name}}* specialises in laboratory equipment maintenance:\n\n🔬 Analytical and measuring instruments, centrifuges, incubators and ovens, autoclaves, biosafety cabinets and fume hoods, balances, pH meters, laboratory refrigerators and freezers, and more\n🛠️ Scheduled preventive maintenance + breakdown repairs\n📦 Spare parts supply\n📄 Technical report after every visit and a service history for each device\n\n[Optional: Brands we service: {{brands}}]\n[Optional: {{manufacturer authorisations, if any}}]\n\nCould you send us your equipment list (type, manufacturer, model, quantity) so we can prepare an annual contract offer?"}, {"t": "Preventive maintenance visit confirmation", "b": "Hello {{client_name}},\nA reminder of the *laboratory equipment preventive maintenance* visit 🔬\n📅 {{date}} ⏰ {{time}}\n📍 {{lab/department}}\n👷 Engineer: {{engineer_name}} – {{engineer_mobile}}\n\nEquipment covered in this visit: {{device_count}} devices (list attached).\nIf possible, please switch off the listed equipment and remove any samples before the visit 🙏"}, {"t": "Equipment fault report received", "b": "Your report has been logged ✅\n🔖 Ticket No.: *{{ticket_number}}*\n🔬 Device: {{device_type}} – {{manufacturer/model}} – Serial No. {{serial_number}}\n⚠️ Fault: {{fault_description}}\n\n⏱️ Visit scheduled: {{date_and_time}}\n👷 Engineer: {{engineer_name}}\n\nA photo or short video of the fault, or of any error message on the screen, will help us bring the likely spare parts 📸"}, {"t": "Technician on the way", "b": "Hello {{client_name}} 👋\nOur engineer *{{engineer_name}}* is on the way to you now 🚗\n⏱️ Estimated arrival: {{time}}\n📞 {{engineer_mobile}}"}, {"t": "Repair completion report", "b": "Hello {{client_name}},\nTicket No. *{{ticket_number}}* has been completed ✅\n\n🔬 Device: {{device_type}} – {{model}}\n🔍 Cause of fault: {{root_cause}}\n🛠️ Action taken: {{action}}\n🔩 Parts replaced: {{parts / none}}\n✔️ Current status: {{working normally / working with a remark}}\n\n📎 Service report attached – please review and sign.\n[Optional: We recommend {{calibrating the device after the repair}}, as the repair involved a part that affects measurement accuracy.]"}, {"t": "Spare parts quotation", "b": "Hello {{client_name}},\nFollowing inspection of the *{{device_type}} – {{model}}*, the following is required:\n🔩 {{part_1}} — SAR {{price_1}}\n🔩 {{part_2}} — SAR {{price_2}}\n🛠️ Installation: SAR {{installation_cost}}\n\n💰 Total: SAR {{total}} {{incl./excl.}} VAT\n⏱️ Parts lead time: {{lead_time}}\n🛡️ Parts warranty: {{warranty}}\n\nWe'll order the parts as soon as we receive your approval 🙏"}, {"t": "Beyond economical repair / replacement recommended", "b": "Hello {{client_name}},\nAfter technical inspection of the *{{device_type}} – Serial No. {{serial_number}}*, we found that:\n▫️ {{reason: parts are no longer available from the manufacturer / repair cost exceeds {{percentage}}% of a new unit / the device is no longer supported by the manufacturer}}\n\nWe recommend {{replacement / decommissioning}} and are happy to propose suitable alternatives.\n📎 Technical report attached."}]}, {"name": "Calibration", "items": [{"t": "Calibration services introduction", "b": "Dear {{client_name}},\n*{{company_name}}* provides *equipment calibration* on site or at our laboratory:\n\n⚖️ Balances and weights\n🌡️ Temperature (incubators, ovens, refrigerators, water baths, autoclaves)\n💧 Pipettes and volumetric glassware\n🔄 Centrifuges (speed and time)\n🧪 pH and conductivity meters\n📏 Pressure, temperature and humidity gauges\n[Add or remove according to our scope: {{calibration_scope}}]\n\n📄 Each device receives a calibration certificate showing as-found and as-left results, measurement uncertainty and traceability to reference standards.\n[Optional: Calibration is {{accredited by {{accreditation_body}} / performed through our accredited partner laboratory: {{lab_name}}}}]\n\nSend us your equipment list and we'll share a quotation and an annual calibration plan 📋"}, {"t": "Calibration due reminder (30 days before)", "b": "Dear {{client_name}},\nReminder: calibration of the following equipment expires within *30 days* 📅\n\n{{equipment_list_and_due_dates}}\nExample:\n▫️ Analytical balance – Serial No. {{...}} – due {{date}}\n▫️ Incubator – Serial No. {{...}} – due {{date}}\n\nTo keep you ready for audits and accreditation, we suggest booking your calibration now.\nWhat date suits you?"}, {"t": "Calibration appointment confirmation", "b": "Hello {{client_name}},\nYour *calibration* appointment is confirmed ✅\n📅 {{date}} ⏰ {{time}}\n📍 {{location}}\n🔢 Number of devices: {{quantity}}\n👷 Technician: {{technician_name}}\n\n📌 Before the visit, please:\n▫️ Switch on temperature equipment (incubators, ovens) {{duration}} in advance so it stabilises\n▫️ Clean the balances and keep them away from air-conditioning drafts and vibration\n▫️ Have pipettes clean and ready\n▫️ Have the quality or lab supervisor available to receive the results"}, {"t": "Calibration certificates ready", "b": "Hello {{client_name}},\nCalibration of your equipment is complete ✅\n📄 *Calibration certificates* ({{quantity}} certificates) attached.\n\n▫️ Within tolerance: {{pass_count}} devices\n▫️ Adjusted, now within tolerance: {{adjusted_count}} devices\n▫️ Out of tolerance: {{fail_count}} devices (details in the next message)\n\n📅 Next calibration due: {{next_calibration_date}}\nA calibration label has been placed on each device 🏷️"}, {"t": "Device out of tolerance", "b": "⚠️ *Calibration result notice – {{lab_name}}*\nDevice: {{device_type}} – Serial No. {{serial_number}}\nResult: *Out of tolerance* (deviation {{deviation}}, permitted limit {{tolerance}})\n{{could not be adjusted on site / requires repair}}\n\n📌 We recommend:\n1️⃣ Stop using the device and tag it \"Do not use\"\n2️⃣ Review results produced by the device since its last good calibration on {{last_calibration_date}}, as per your quality procedures\n3️⃣ {{Repair and recalibrate / replace}} the device – quotation to follow within {{duration}}\n\nFor clarification: {{engineer_name}} – {{engineer_mobile}}"}, {"t": "Annual calibration plan", "b": "Hello {{client_name}},\nPlease find attached the *{{year}} annual calibration and maintenance plan* for {{lab_name}} 📋\n\nIt includes:\n▫️ A schedule of all equipment with calibration and maintenance due dates\n▫️ Visits grouped into {{visit_count}} visits to minimise downtime\n▫️ A reminder from us 30 days before each due date\n\nPlease review and approve it. We can adjust the dates to fit your schedule."}]}, {"name": "Occasions", "items": [{"t": "Seasonal greetings (Ramadan / Eid / Saudi National Day)", "b": "{{Ramadan Kareem / Eid Mubarak / Happy Saudi National Day 🇸🇦}}\nWarm wishes from all of us at *{{company_name}}*.\n\n📌 Our working hours during {{occasion}}: {{working_hours}}\n[Optional: 🚨 Our emergency service is available 24/7: {{emergency_number}}]"}]}]};
const SHORT={ar:["عامة","غازات طبية","غازات صناعية","صيانة المختبرات","المعايرة","مناسبات"],en:["General","Medical gas","Industrial gas","Lab maintenance","Calibration","Occasions"]};
const T={ar:{all:"الكل",copy:"نسخ",done:"تم النسخ",toast:"تم النسخ — ألصقها في الواتساب",fail:"ما قدرنا ننسخ تلقائياً، حدد النص وانسخه يدوياً",ph:"ابحث: معايرة، تسريب، عرض سعر…",none:t=>"ما فيه رسالة فيها «"+t+"». جرّب كلمة ثانية."},
 en:{all:"All",copy:"Copy",done:"Copied",toast:"Copied — paste it in WhatsApp",fail:"Couldn't copy automatically. Select the text and copy it manually.",ph:"Search: calibration, leak, quotation…",none:t=>"No message matches “"+t+"”. Try another word."}};
const ALIAS={company_name:"اسم_الشركة",employee_name:"اسم_الموظف",contact_number:"رقم_التواصل",emergency_number:"رقم_الطوارئ",website:"الموقع_الإلكتروني",client_name:"اسم_العميل"};
let lang="ar";
const COPY_ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
Object.values(DATA).forEach(L=>{let n=0;L.forEach(s=>s.items.forEach(it=>it.n=++n))});
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const inputs=[...document.querySelectorAll('.me input[type=text]')];
inputs.forEach(i=>{i.value=store.get('wa-'+i.dataset.k)||'';i.addEventListener('input',()=>{store.set('wa-'+i.dataset.k,i.value);render()})});
const opt=document.getElementById('f-opt'); opt.checked=store.get('wa-opt')==='1';
opt.addEventListener('change',()=>{store.set('wa-opt',opt.checked?'1':'0');render()});
function vals(){const v={};inputs.forEach(i=>{if(i.value.trim())v[i.dataset.k]=i.value.trim()});for(const e in ALIAS)if(v[ALIAS[e]]!==undefined)v[e]=v[ALIAS[e]];return v}
function fill(text){const v=vals();let t=text.replace(/\{\{([^{}]+)\}\}/g,(m,k)=>v[k.trim()]!==undefined?v[k.trim()]:m);
  if(opt.checked)t=t.split('\n').filter(l=>!/^\s*\[(اختياري|Optional)/.test(l)).join('\n').replace(/\[(?:اختياري|Optional)[:,]?\s*([^\]]*)\]/g,'$1');
  return t}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function pretty(raw){const v=vals();
  let h=esc(raw);
  h=h.replace(/\{\{([^{}]+)\}\}/g,(m,k)=>v[k.trim()]!==undefined?'<span class="filled">'+esc(v[k.trim()])+'</span>':'<span class="ph">'+k+'</span>');
  h=h.replace(/(^|[\s(])\*([^*\n]+)\*/g,'$1<b>$2</b>').replace(/(^|[\s(])_([^_\n]+)_/g,'$1<i>$2</i>');
  h=h.split('\n').map(l=>/^\s*\[(اختياري|Optional)/.test(l)?'<span class="optl">'+l+'</span>':l).join('\n');
  return h}
let cat=-1;
const chips=document.getElementById('chips');const q=document.getElementById('q');q.addEventListener('input',render);
function chip(label,i,count){const b=document.createElement('button');b.className='chip';b.type='button';b.innerHTML=label+'<span class="n">'+count+'</span>';b.onclick=()=>{cat=i;render();window.scrollTo({top:0})};return b}
function buildChips(){chips.innerHTML='';const L=DATA[lang];chips.append(chip(T[lang].all,-1,L.reduce((a,s)=>a+s.items.length,0)));L.forEach((s,i)=>chips.append(chip(SHORT[lang][i]||s.name,i,s.items.length)))}
function setLang(l){lang=l;cat=-1;store.set('wa-lang',l);document.getElementById('l-ar').setAttribute('aria-pressed',String(l==='ar'));document.getElementById('l-en').setAttribute('aria-pressed',String(l==='en'));
  q.placeholder=T[l].ph;const d=l==='en'?'ltr':'rtl';q.dir=d;chips.dir=d;document.getElementById('out').dir=d;buildChips();render()}
document.getElementById('l-ar').onclick=()=>setLang('ar');document.getElementById('l-en').onclick=()=>setLang('en');

function render(){
  [...chips.children].forEach((c,i)=>c.setAttribute('aria-pressed',String(i-1===cat)));
  const term=q.value.trim().toLowerCase();const out=document.getElementById('out');out.innerHTML='';let shown=0;
  DATA[lang].forEach((s,i)=>{if(cat!==-1&&cat!==i)return;
    const items=s.items.filter(it=>!term||(it.t+' '+it.b).toLowerCase().includes(term));if(!items.length)return;
    const h=document.createElement('h2');h.textContent=s.name;out.append(h);
    const list=document.createElement('div');list.className='list';
    items.forEach(it=>{shown++;const c=document.createElement('article');c.className='card';c.dir=lang==='en'?'ltr':'rtl';c.lang=lang;
      c.innerHTML='<div class="head"><h3><span class="num">'+it.n+'</span>'+esc(it.t)+'</h3><button class="copy" type="button">'+COPY_ICON+T[lang].copy+'</button></div><div class="bubble">'+pretty(it.b)+'</div>';
      c.querySelector('.copy').onclick=e=>copy(fill(it.b),e.currentTarget);list.append(c)});
    out.append(list)});
  if(!shown)out.innerHTML='<p class="empty">'+esc(T[lang].none(q.value.trim()))+'</p>';
}
const toast=document.getElementById('toast');let tt;
function say(m){toast.textContent=m;toast.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>toast.classList.remove('show'),1800)}
function mark(btn){btn.classList.add('done');btn.innerHTML=COPY_ICON+T[lang].done;setTimeout(()=>{btn.classList.remove('done');btn.innerHTML=COPY_ICON+T[lang].copy},1600)}
function fallback(text,btn){const ta=document.getElementById('sel');ta.value=text;ta.focus();ta.select();ta.setSelectionRange(0,text.length);
  let ok=false;try{ok=document.execCommand('copy')}catch(e){}
  if(ok){mark(btn);say(T[lang].toast)}else{say(T[lang].fail);
