<title>رسائل واتساب للعملاء</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: one column of message cards under a sticky search + category bar; RTL, phone-first */
:root{
  --bg:#eef3f2; --surface:#ffffff; --ink:#132225; --muted:#5b6d70; --line:#d5e0df;
  --accent:#0b6f6a; --accent-ink:#ffffff; --bubble:#e3f4ec; --ph-bg:#fff1c9; --ph-ink:#6b4a00; --opt:#7a6f9c;
  --font:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1719; --surface:#152225; --ink:#e3eeed; --muted:#93a7a9; --line:#26393c;
  --accent:#3fb8a8; --accent-ink:#06201d; --bubble:#173a33; --ph-bg:#4a3a0e; --ph-ink:#ffd978; --opt:#b3a7dd; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1719; --surface:#152225; --ink:#e3eeed; --muted:#93a7a9; --line:#26393c;
  --accent:#3fb8a8; --accent-ink:#06201d; --bubble:#173a33; --ph-bg:#4a3a0e; --ph-ink:#ffd978; --opt:#b3a7dd; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto}
header.top{padding-block:20px 8px}
h1{font-size:1.45rem;margin:0;font-weight:700;text-wrap:balance}
.sub{color:var(--muted);margin:2px 0 0;font-size:.9rem}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.search{width:100%;font:inherit;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.search:focus,.chip:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:5px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip .n{opacity:.7;font-size:.75rem;margin-inline-start:4px}
details.me{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-block:14px 4px}
details.me summary{cursor:pointer;padding:12px 14px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:8px}
details.me summary::after{content:"▾";color:var(--muted)}
details.me[open] summary::after{content:"▴"}
.me .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;padding:0 14px 14px}
.me label{display:grid;gap:3px;font-size:.82rem;color:var(--muted)}
.me input[type=text]{font:inherit;font-size:.95rem;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-width:0}
.toggle{display:flex;align-items:center;gap:8px;padding:0 14px 14px;font-size:.88rem}
.note{font-size:.8rem;color:var(--muted);padding:0 14px 14px;margin:0}
h2{font-size:1.05rem;margin:26px 0 10px;color:var(--accent);font-weight:700}
.list{display:grid;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:10px;min-width:0}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.head h3{margin:0;font-size:.98rem;font-weight:600;min-width:0;text-wrap:balance}
.num{color:var(--muted);font-variant-numeric:tabular-nums;font-weight:500;margin-inline-end:6px}
.copy{flex:none;font:inherit;font-size:.88rem;font-weight:600;border:0;border-radius:9px;padding:7px 14px;background:var(--accent);color:var(--accent-ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:36px}
.copy.done{background:var(--ink);color:var(--surface)}
.copy svg{width:16px;height:16px}
.bubble{background:var(--bubble);border-radius:12px 4px 12px 12px;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:.93rem;line-height:1.75;min-width:0}
.ph{background:var(--ph-bg);color:var(--ph-ink);border-radius:4px;padding:0 3px;font-size:.88em;font-weight:500}
.filled{border-bottom:1.5px dotted var(--accent)}
.optl{color:var(--opt)}
.empty{text-align:center;color:var(--muted);padding:40px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:9px 18px;border-radius:999px;font-size:.9rem;opacity:0;transition:.2s;pointer-events:none;z-index:20}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sel{position:fixed;opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
<div class="wrap" dir="rtl" lang="ar">
  <header class="top">
    <h1>رسائل واتساب للعملاء</h1>
    <p class="sub">الغازات الطبية والصناعية • صيانة أجهزة المختبرات • المعايرة — اضغط «نسخ» والصق في واتساب</p>
  </header>
  <details class="me" id="me">
    <summary>بياناتي (تُعبّأ في الرسائل تلقائياً)</summary>
    <div class="grid">
      <label>اسم الشركة<input type="text" id="f-company" data-k="اسم_الشركة"></label>
      <label>اسم الموظف<input type="text" id="f-emp" data-k="اسم_الموظف"></label>
      <label>رقم التواصل<input type="text" id="f-phone" data-k="رقم_التواصل" inputmode="tel"></label>
      <label>رقم الطوارئ<input type="text" id="f-emg" data-k="رقم_الطوارئ" inputmode="tel"></label>
      <label>الموقع الإلكتروني<input type="text" id="f-web" data-k="الموقع_الإلكتروني"></label>
      <label>اسم العميل (للرسالة الحالية)<input type="text" id="f-client" data-k="اسم_العميل"></label>
    </div>
    <label class="toggle"><input type="checkbox" id="f-opt"> حذف الأسطر الاختيارية [اختياري: …] عند النسخ</label>
    <p class="note">البيانات تُحفظ على جهازك فقط. الحقول المظللة بالأصفر تبقى في الرسالة لتعديلها يدوياً قبل الإرسال.</p>
  </details>
  <div class="bar">
    <input class="search" id="q" type="search" placeholder="ابحث: معايرة، تسريب، عرض سعر…" aria-label="بحث في الرسائل">
    <div class="chips" id="chips" role="toolbar" aria-label="الأقسام"></div>
  </div>
  <main id="out"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<textarea class="sel" id="sel" aria-hidden="true" tabindex="-1"></textarea>
<script>
const DATA=[{"name": "رسائل عامة", "items": [{"t": "ترحيب وتعريف بالشركة (أول تواصل)", "b": "السلام عليكم ورحمة الله وبركاته\nأهلاً {{اسم_العميل}} 🌿\n\nمعك {{اسم_الموظف}} من *{{اسم_الشركة}}*.\nنقدم لكم:\n▫️ تمديد وصيانة شبكات *الغازات الطبية* (أكسجين، هواء طبي، شفط، نيتروز، CO₂)\n▫️ تمديد وصيانة شبكات *الغازات الصناعية* والمختبرية (نيتروجين، أرجون، هيليوم، هواء مضغوط...)\n▫️ *صيانة أجهزة المختبرات* الوقائية والإصلاحية\n▫️ *معايرة الأجهزة* وإصدار شهادات المعايرة\n\nيسعدنا نخدمكم. وش احتياجكم حالياً عشان نوجهكم للمختص؟\n📞 {{رقم_التواصل}}"}, {"t": "رد خارج أوقات الدوام (رد آلي)", "b": "شكراً لتواصلك مع *{{اسم_الشركة}}* 🙏\nأوقات العمل: {{أيام_الدوام}} من {{من_الساعة}} إلى {{إلى_الساعة}}.\nبنرد عليك أول ما يبدأ الدوام.\n\n🚨 لو عندك *عطل طارئ* في شبكة الغازات الطبية أو جهاز حرج، اتصل على رقم الطوارئ: {{رقم_الطوارئ}}"}, {"t": "استلام طلب وجمع البيانات", "b": "أهلاً {{اسم_العميل}}، استلمنا طلبك ✅\nعشان نجهز لك عرض سعر دقيق، نحتاج منك:\n1️⃣ اسم الجهة والمدينة/الموقع\n2️⃣ نوع الخدمة: (تمديد / صيانة / معايرة)\n3️⃣ قائمة الأجهزة أو نقاط الغاز (النوع، الماركة، الموديل، العدد)\n4️⃣ هل تحتاجون عقد سنوي أو زيارة واحدة؟\n5️⃣ أي مخططات أو صور متوفرة\n\nتقدر ترسلها هنا مباشرة 📎"}, {"t": "حجز زيارة معاينة للموقع", "b": "أهلاً {{اسم_العميل}}\nتم تأكيد *زيارة المعاينة* ✅\n📅 التاريخ: {{التاريخ}}\n⏰ الوقت: {{الوقت}}\n📍 الموقع: {{الموقع}}\n👷 المهندس: {{اسم_المهندس}} – {{جوال_المهندس}}\n\nنرجو تسهيل الدخول للموقع، ووجود مسؤول من طرفكم إن أمكن.\nلو تبي تغيّر الموعد بلغنا قبلها بيوم 🙏"}, {"t": "إرسال عرض السعر", "b": "أهلاً {{اسم_العميل}}\nمرفق لكم *عرض السعر رقم {{رقم_العرض}}* الخاص بـ: {{وصف_الخدمة}} 📄\n\n▫️ القيمة الإجمالية: {{المبلغ}} ر.س {{شامل/غير_شامل}} ضريبة القيمة المضافة\n▫️ مدة التنفيذ: {{المدة}}\n▫️ صلاحية العرض: {{مدة_الصلاحية}}\n\nلأي استفسار أو تعديل أنا جاهز. ونتشرف بخدمتكم 🤝"}, {"t": "متابعة عرض سعر (بعد 3–5 أيام)", "b": "مساء الخير {{اسم_العميل}} 🌷\nحبيت أتابع معكم بخصوص عرض السعر رقم {{رقم_العرض}} المرسل بتاريخ {{التاريخ}}.\nهل عندكم أي ملاحظات أو تحتاجون توضيح لأي بند؟\nنقدر نرتب اجتماع سريع أو زيارة لو يناسبكم."}, {"t": "تذكير بالدفع (بأسلوب لطيف)", "b": "السلام عليكم {{اسم_العميل}}\nنود تذكيركم بالفاتورة رقم *{{رقم_الفاتورة}}* بمبلغ {{المبلغ}} ر.س، وتاريخ استحقاقها {{تاريخ_الاستحقاق}}.\n📎 مرفق نسخة من الفاتورة.\nلو تم السداد نرجو إرسال صورة الإيصال، وشكراً لتعاونكم 🙏"}, {"t": "استبيان رضا بعد الخدمة", "b": "شكراً {{اسم_العميل}} على ثقتكم بـ *{{اسم_الشركة}}* 🙏\nيهمنا رأيكم في خدمة {{وصف_الخدمة}}:\n⭐ من 1 إلى 5، كم تقيّم الخدمة؟\n💬 وش أكثر شي عجبك، ووش اللي نقدر نحسنه؟"}]}, {"name": "الغازات الطبية (Medical Gas Pipeline Systems)", "items": [{"t": "تعريف بخدمات الغازات الطبية (للمستشفيات والمراكز والعيادات)", "b": "السلام عليكم {{اسم_العميل}}\n*{{اسم_الشركة}}* تقدم حلول متكاملة لأنظمة الغازات الطبية:\n\n🔹 تصميم وتمديد الشبكات بأنابيب النحاس الطبي المنظف للأكسجين\n🔹 توريد وتركيب مخارج الغاز (Outlets) ولوحات الإنذار وصناديق المحابس (Zone Valve Boxes)\n🔹 المانيفولد ومحطات الهواء الطبي والشفط (Plant Room)\n🔹 الاختبارات والتشغيل: اختبار الضغط والتسريب، التطهير (Purging)، فحص النقاء وتطابق الغاز (Cross-connection)\n🔹 عقود الصيانة الوقائية والطارئة\n\n[اختياري: نعمل وفق {{المعايير_المعتمدة_لدينا مثل HTM 02-01 / NFPA 99 / ISO 7396-1}}]\n[اختياري: {{تراخيص/تأهيل الشركة لدى الجهات الصحية}}]\n\nهل تحبون نرتب زيارة معاينة مجانية؟"}, {"t": "تأكيد موعد صيانة وقائية للغازات الطبية", "b": "أهلاً {{اسم_العميل}}\nنذكّركم بموعد *الصيانة الوقائية لشبكة الغازات الطبية* – {{اسم_المنشأة}} 🏥\n📅 {{التاريخ}} ⏰ {{الوقت}}\n👷 الفريق: {{اسم_الفني}} – {{جوال_الفني}}\n\nتشمل الزيارة: فحص المانيفولد والمنظمات، لوحات الإنذار، صناديق المحابس، المخارج، كمبروسرات الهواء الطبي ومضخات الشفط، وفحص التسريب.\n\n⚠️ قد نحتاج إيقاف مؤقت لبعض المناطق — بننسق مع قسم التمريض/الصيانة قبل أي إيقاف، ولن يُغلق أي محبس بدون موافقتكم."}, {"t": "استلام بلاغ عطل طارئ (غازات طبية)", "b": "تم استلام بلاغك 🚨\nرقم البلاغ: *{{رقم_البلاغ}}*\nالعطل: {{وصف_العطل}}\nالموقع: {{القسم/الدور}}\n\n👷 الفني {{اسم_الفني}} في الطريق، الوصول المتوقع خلال {{المدة}}.\n📞 للتواصل المباشر: {{جوال_الفني}}\n\n⚠️ إلى حين وصولنا: لا تحاولوا فك أو تعديل أي جزء من الشبكة، واعتمدوا على الأسطوانات الاحتياطية حسب إجراءات المنشأة."}, {"t": "إنجاز أعمال تمديد واختبار (تسليم)", "b": "أهلاً {{اسم_العميل}}\nيسعدنا إبلاغكم بـ *إنجاز أعمال تمديد شبكة الغازات الطبية* في {{الموقع}} ✅\n\nتم تنفيذ:\n✔️ اختبار الضغط والتسريب\n✔️ التطهير (Purging)\n✔️ فحص تطابق الغازات ومنع التداخل (Cross-connection)\n✔️ فحص النقاء ونسبة الجسيمات [اختياري حسب العقد]\n✔️ تشغيل واختبار لوحات الإنذار\n\n📎 مرفق تقرير الاختبارات ومحضر التسليم.\nنقترح تحديد موعد لتدريب فريقكم على تشغيل لوحات الإنذار ومحابس الطوارئ."}, {"t": "تذكير بانتهاء/تجديد عقد الصيانة", "b": "السلام عليكم {{اسم_العميل}}\nعقد صيانة *{{نوع_النظام}}* رقم {{رقم_العقد}} ينتهي بتاريخ *{{تاريخ_الانتهاء}}* 📅\n\nحرصاً على استمرارية الخدمة بدون انقطاع، نقترح تجديد العقد.\n📎 مرفق عرض التجديد، ويشمل: {{عدد_الزيارات}} زيارة وقائية + الاستجابة للأعطال خلال {{زمن_الاستجابة}}.\n\nنسعد بخدمتكم سنة جديدة 🤝"}]}, {"name": "الغازات الصناعية والمختبرية", "items": [{"t": "تعريف بخدمات الغازات الصناعية (مصانع، مختبرات، ورش)", "b": "السلام عليكم {{اسم_العميل}}\nنقدم في *{{اسم_الشركة}}* تمديد وصيانة شبكات الغازات الصناعية والمختبرية:\n\n🔸 الغازات: نيتروجين، أرجون، أكسجين، CO₂، هيليوم، هيدروجين، أسيتيلين، هواء مضغوط، خلطات الغاز\n🔸 الأنابيب: ستانلس ستيل، نحاس، حسب نوع الغاز ودرجة النقاء المطلوبة\n🔸 المانيفولد ومحطات الأسطوانات، المنظمات (Regulators)، محابس الإغلاق، كواشف التسريب\n🔸 خطوط الغاز لأجهزة التحليل (GC، ICP، AAS...) والغازات عالية النقاء\n🔸 اختبار الضغط والتسريب والتشغيل والصيانة الدورية\n\nشاركونا المخطط أو قائمة الأجهزة ونرتب لكم المعاينة وعرض السعر."}, {"t": "تقرير زيارة صيانة شبكة غازات", "b": "أهلاً {{اسم_العميل}}\nتمت زيارة الصيانة لشبكة الغازات في {{الموقع}} بتاريخ {{التاريخ}} ✅\n\n📋 *ملخص النتائج:*\n▫️ الحالة العامة: {{سليمة / تحتاج إجراء}}\n▫️ نقاط التسريب: {{لا يوجد / العدد والمكان}}\n▫️ المنظمات والمحابس: {{الحالة}}\n▫️ إجراءات تمت في الموقع: {{الإجراءات}}\n\n⚠️ *توصيات:* {{التوصيات}}\n📎 التقرير الكامل مرفق."}, {"t": "تنبيه سلامة بعد اكتشاف تسريب", "b": "⚠️ *تنبيه سلامة – {{اسم_المنشأة}}*\nأثناء الفحص تم رصد *تسريب* في خط {{نوع_الغاز}} عند {{المكان}}.\n\nالإجراء المتخذ: {{تم عزل الخط / تم الإصلاح المؤقت}}.\nالمطلوب: {{الإصلاح النهائي / تغيير القطعة}} — عرض السعر يصلكم خلال {{المدة}}.\n\nنرجو عدم إعادة فتح المحبس المعزول قبل التنسيق معنا.\nللاستفسار: {{اسم_المهندس}} – {{جوال_المهندس}}"}]}, {"name": "صيانة أجهزة المختبرات", "items": [{"t": "تعريف بخدمات صيانة أجهزة المختبرات", "b": "السلام عليكم {{اسم_العميل}}\n*{{اسم_الشركة}}* متخصصة في صيانة أجهزة المختبرات:\n\n🔬 أجهزة التحليل والقياس، الطرد المركزي، الحاضنات والأفران، أجهزة التعقيم (الأوتوكلاف)، كبائن السلامة الحيوية وكبائن الشفط، الموازين، أجهزة الـ pH، الثلاجات والفريزرات المختبرية، وغيرها\n🛠️ صيانة وقائية مجدولة + إصلاح الأعطال\n📦 توفير قطع الغيار\n📄 تقرير فني بعد كل زيارة وسجل لكل جهاز\n\n[اختياري: الماركات التي نخدمها: {{الماركات}}]\n[اختياري: {{تفويضات الوكلاء إن وُجدت}}]\n\nممكن ترسلون لنا قائمة الأجهزة (النوع، الماركة، الموديل، العدد) ونجهز لكم عرض عقد سنوي؟"}, {"t": "تأكيد موعد صيانة وقائية للأجهزة", "b": "أهلاً {{اسم_العميل}}\nنذكّركم بزيارة *الصيانة الوقائية لأجهزة المختبر* 🔬\n📅 {{التاريخ}} ⏰ {{الوقت}}\n📍 {{اسم_المختبر/القسم}}\n👷 المهندس: {{اسم_المهندس}} – {{جوال_المهندس}}\n\nالأجهزة المشمولة بهذه الزيارة: {{عدد_الأجهزة}} جهاز (القائمة مرفقة).\nنرجو التأكد من إيقاف الأجهزة المطلوبة وتفريغها من العينات قبل الزيارة إن أمكن 🙏"}, {"t": "استلام بلاغ عطل جهاز", "b": "تم تسجيل بلاغكم ✅\n🔖 رقم البلاغ: *{{رقم_البلاغ}}*\n🔬 الجهاز: {{نوع_الجهاز}} – {{الماركة/الموديل}} – رقم تسلسلي {{الرقم_التسلسلي}}\n⚠️ العطل: {{وصف_العطل}}\n\n⏱️ موعد الزيارة: {{التاريخ_والوقت}}\n👷 المهندس: {{اسم_المهندس}}\n\nلو تقدرون ترسلون صورة أو فيديو للعطل أو رسالة الخطأ على الشاشة، يساعدنا نجهز القطع المحتملة مسبقاً 📸"}, {"t": "الفني في الطريق", "b": "أهلاً {{اسم_العميل}} 👋\nالمهندس *{{اسم_المهندس}}* في الطريق إليكم الآن 🚗\n⏱️ الوصول المتوقع: {{الوقت}}\n📞 {{جوال_المهندس}}"}, {"t": "تقرير إنجاز الإصلاح", "b": "أهلاً {{اسم_العميل}}\nتم إنجاز البلاغ رقم *{{رقم_البلاغ}}* ✅\n\n🔬 الجهاز: {{نوع_الجهاز}} – {{الموديل}}\n🔍 سبب العطل: {{سبب_العطل}}\n🛠️ الإجراء: {{الإجراء}}\n🔩 القطع المستبدلة: {{القطع / لا يوجد}}\n✔️ حالة الجهاز الآن: {{يعمل بشكل طبيعي / يعمل مع ملاحظة}}\n\n📎 تقرير الخدمة مرفق، نرجو اعتماده/توقيعه.\n[اختياري: ننصح بـ{{معايرة الجهاز بعد الإصلاح}} لأن الإصلاح شمل جزءاً يؤثر على دقة القياس.]"}, {"t": "عرض سعر قطع غيار", "b": "أهلاً {{اسم_العميل}}\nبعد فحص جهاز *{{نوع_الجهاز}} – {{الموديل}}*، يحتاج الجهاز إلى:\n🔩 {{القطعة_1}} — {{السعر_1}} ر.س\n🔩 {{القطعة_2}} — {{السعر_2}} ر.س\n🛠️ أجرة التركيب: {{أجرة_التركيب}} ر.س\n\n💰 الإجمالي: {{الإجمالي}} ر.س {{شامل/غير_شامل}} الضريبة\n⏱️ مدة توريد القطع: {{مدة_التوريد}}\n🛡️ ضمان القطع: {{مدة_الضمان}}\n\nننتظر موافقتكم لطلب القطع 🙏"}, {"t": "جهاز غير قابل للإصلاح / توصية بالاستبدال", "b": "أهلاً {{اسم_العميل}}\nبعد الفحص الفني لجهاز *{{نوع_الجهاز}} – رقم تسلسلي {{الرقم_التسلسلي}}*، تبيّن أن:\n▫️ {{السبب: القطع غير متوفرة من المصنع / تكلفة الإصلاح تتجاوز {{النسبة}}% من قيمة جهاز جديد / الجهاز خارج دعم المصنع}}\n\nنوصي بـ{{الاستبدال / التكهين}}، ومستعدين نقدم لكم بدائل مناسبة.\n📎 التقرير الفني مرفق."}]}, {"name": "معايرة الأجهزة (Calibration)", "items": [{"t": "تعريف بخدمات المعايرة", "b": "السلام عليكم {{اسم_العميل}}\nنقدم في *{{اسم_الشركة}}* خدمات *معايرة الأجهزة* في موقعكم أو في المختبر:\n\n⚖️ الموازين والأوزان\n🌡️ درجة الحرارة (حاضنات، أفران، ثلاجات، حمامات مائية، أوتوكلاف)\n💧 الماصات (Pipettes) والأدوات الحجمية\n🔄 أجهزة الطرد المركزي (السرعة والوقت)\n🧪 أجهزة pH والتوصيلية\n📏 مقاييس الضغط والحرارة والرطوبة\n[أضف/احذف حسب نطاق المعايرة المتوفر: {{نطاق_المعايرة}}]\n\n📄 شهادة معايرة لكل جهاز تتضمن النتائج قبل وبعد الضبط، ودرجة عدم اليقين، والتتبعية للمعايير المرجعية.\n[اختياري: المعايرة {{معتمدة ISO/IEC 17025 من {{جهة_الاعتماد}} / تتم عبر مختبر معتمد شريك: {{اسم_المختبر}}}}]\n\nأرسلوا قائمة الأجهزة ونرسل لكم العرض وخطة المعايرة السنوية 📋"}, {"t": "تذكير بقرب موعد المعايرة (قبل 30 يوماً)", "b": "السلام عليكم {{اسم_العميل}}\nتذكير: معايرة الأجهزة التالية تنتهي صلاحيتها خلال *30 يوماً* 📅\n\n{{قائمة_الأجهزة_وتواريخ_الاستحقاق}}\nمثال:\n▫️ ميزان حساس – SN {{...}} – يستحق {{التاريخ}}\n▫️ حاضنة – SN {{...}} – يستحق {{التاريخ}}\n\nحرصاً على جاهزيتكم للتدقيق والاعتماد، نقترح نحجز موعد المعايرة الآن.\nما الموعد اللي يناسبكم؟"}, {"t": "تأكيد موعد المعايرة", "b": "أهلاً {{اسم_العميل}}\nتم تأكيد موعد *المعايرة* ✅\n📅 {{التاريخ}} ⏰ {{الوقت}}\n📍 {{الموقع}}\n🔢 عدد الأجهزة: {{العدد}}\n👷 الفني: {{اسم_الفني}}\n\n📌 للتجهيز قبل الزيارة:\n▫️ تشغيل أجهزة الحرارة (الحاضنات/الأفران) قبل الزيارة بـ{{المدة}} لتستقر\n▫️ تنظيف الموازين وإبعادها عن التيارات الهوائية والاهتزاز\n▫️ تجهيز الماصات نظيفة\n▫️ وجود مسؤول الجودة أو المختبر لاستلام النتائج"}, {"t": "شهادات المعايرة جاهزة", "b": "أهلاً {{اسم_العميل}}\nتم الانتهاء من معايرة أجهزتكم ✅\n📄 *شهادات المعايرة* ({{العدد}} شهادة) مرفقة.\n\n▫️ مطابقة: {{عدد_المطابق}} جهاز\n▫️ تم ضبطها ثم مطابقة: {{عدد_المضبوط}} جهاز\n▫️ غير مطابقة: {{عدد_غير_المطابق}} جهاز (التفاصيل بالرسالة التالية)\n\n📅 موعد المعايرة القادمة: {{تاريخ_المعايرة_القادمة}}\nوتم لصق ملصق المعايرة على كل جهاز 🏷️"}, {"t": "جهاز خارج حدود القبول (Out of Tolerance)", "b": "⚠️ *تنبيه نتيجة معايرة – {{اسم_المختبر}}*\nالجهاز: {{نوع_الجهاز}} – SN {{الرقم_التسلسلي}}\nالنتيجة: *خارج حدود القبول* (الانحراف {{قيمة_الانحراف}} – الحد المسموح {{الحد_المسموح}})\n{{تعذر الضبط في الموقع / يحتاج صيانة}}\n\n📌 نوصي بـ:\n1️⃣ إيقاف استخدام الجهاز ووضع ملصق «لا يُستخدم» عليه\n2️⃣ مراجعة النتائج التي صدرت منه منذ آخر معايرة سليمة بتاريخ {{تاريخ_آخر_معايرة}} حسب إجراءات الجودة لديكم\n3️⃣ {{إصلاح الجهاز ثم إعادة معايرته / استبداله}} — عرض السعر يصلكم خلال {{المدة}}\n\nللتوضيح: {{اسم_المهندس}} – {{جوال_المهندس}}"}, {"t": "إرسال خطة المعايرة السنوية", "b": "أهلاً {{اسم_العميل}}\nمرفق لكم *خطة المعايرة والصيانة السنوية لعام {{السنة}}* لأجهزة {{اسم_المختبر}} 📋\n\nتتضمن:\n▫️ جدول بكل الأجهزة وتواريخ استحقاق المعايرة والصيانة\n▫️ توزيع الزيارات على {{عدد_الزيارات}} زيارة لتقليل توقف العمل\n▫️ تذكير تلقائي منا قبل كل موعد بـ30 يوماً\n\nنرجو مراجعتها واعتمادها، ونقدر نعدل المواعيد حسب جدول عملكم."}]}, {"name": "مناسبات", "items": [{"t": "تهنئة (رمضان / العيد / اليوم الوطني)", "b": "{{رمضان كريم / عيدكم مبارك / كل عام والوطن بخير 🇸🇦}}\nأسرة *{{اسم_الشركة}}* تتقدم لكم بأطيب التهاني، وتتمنى لكم دوام التوفيق.\n\n📌 أوقات العمل خلال {{المناسبة}}: {{أوقات_العمل}}\n[اختياري: 🚨 خدمة الطوارئ متاحة على مدار الساعة: {{رقم_الطوارئ}}]"}]}];

  let h=esc(raw);
  h=h.replace(/\{\{([^{}]+)\}\}/g,(m,k)=>v[k.trim()]!==undefined?'<span class="filled">'+esc(v[k.trim()])+'</span>':'<span class="ph">'+k+'</span>');
  h=h.replace(/(^|[\s(])\*([^*\n]+)\*/g,'$1<b>$2</b>').replace(/(^|[\s(])_([^_\n]+)_/g,'$1<i>$2</i>');
  h=h.split('\n').map(l=>/^\s*\[اختياري/.test(l)?'<span class="optl">'+l+'</span>':l).join('\n');
  return h}
let cat=-1;
const chips=document.getElementById('chips');
function chip(label,i,count){const b=document.createElement('button');b.className='chip';b.type='button';b.innerHTML=label+'<span class="n">'+count+'</span>';b.onclick=()=>{cat=i;render();window.scrollTo({top:0})};return b}
chips.append(chip('الكل',-1,n));DATA.forEach((s,i)=>chips.append(chip(SHORT[i]||s.name,i,s.items.length)));
const q=document.getElementById('q');q.addEventListener('input',render);
function render(){
  [...chips.children].forEach((c,i)=>c.setAttribute('aria-pressed',String(i-1===cat)));
  const term=q.value.trim();const out=document.getElementById('out');out.innerHTML='';let shown=0;
  DATA.forEach((s,i)=>{if(cat!==-1&&cat!==i)return;
    const items=s.items.filter(it=>!term||(it.t+' '+it.b).includes(term));if(!items.length)return;
    const h=document.createElement('h2');h.textContent=s.name;out.append(h);
    const list=document.createElement('div');list.className='list';
    items.forEach(it=>{shown++;const c=document.createElement('article');c.className='card';
      c.innerHTML='<div class="head"><h3><span class="num">'+it.n+'</span>'+esc(it.t)+'</h3><button class="copy" type="button">'+COPY_ICON+'نسخ</button></div><div class="bubble">'+pretty(it.b)+'</div>';
      c.querySelector('.copy').onclick=e=>copy(fill(it.b),e.currentTarget);list.append(c)});
    out.append(list)});
  if(!shown)out.innerHTML='<p class="empty">لا توجد رسالة تطابق «'+esc(term)+'». جرّب كلمة أخرى.</p>';
}
const toast=document.getElementById('toast');let tt;
function say(m){toast.textContent=m;toast.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>toast.classList.remove('show'),1800)}
function mark(btn){btn.classList.add('done');btn.innerHTML=COPY_ICON+'تم النسخ';setTimeout(()=>{btn.classList.remove('done');btn.innerHTML=COPY_ICON+'نسخ'},1600)}
function fallback(text,btn){const ta=document.getElementById('sel');ta.value=text;ta.focus();ta.select();ta.setSelectionRange(0,text.length);
  let ok=false;try{ok=document.execCommand('copy')}catch(e){}
  if(ok){mark(btn);say('تم النسخ — الصقها في واتساب')}else{say('تعذّر النسخ التلقائي، حدّد النص وانسخه يدوياً');
    const b=btn.closest('.card').querySelector('.bubble');const r=document.createRange();r.selectNodeContents(b);const s=getSelection();s.removeAllRanges();s.addRange(r)}}
function copy(text,btn){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(()=>{mark(btn);say('تم النسخ — الصقها في واتساب')},()=>fallback(text,btn))}else fallback(text,btn)}
render();
</script>
