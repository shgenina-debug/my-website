# نشر أداة جمع أرقام العملاء (maps-leads) على Render — انظر maps-leads/README.md قسم "التليفون"
services:
  - type: web
    name: maps-leads
    runtime: python
    rootDir: maps-leads
    plan: starter            # لازم خطة مدفوعة علشان القرص الدائم (البيانات متتمسحش)
    region: singapore        # خارج أوروبا علشان صفحة موافقة الكوكيز بتاعة جوجل
    buildCommand: python --version
    startCommand: python app.py --no-browser
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_PASSWORD     # Render هيطلب منك تكتبه وقت الإنشاء
        sync: false
      - key: SECRET_KEY
        generateValue: true
    disk:
      name: leads-data
      mountPath: /var/data
      sizeGB: 1
