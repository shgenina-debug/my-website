<head>

<style>
:root{

  --bar:#0b6e99;--bar-2:#7fb7d1;
}

    --bg:#0f141a;--surface:#161d25;--surface-2:#1d2630;--text:#e6ebf0;--muted:#9aa7b4;--border:#2a3540;
    --accent:#4fb3e0;--accent-soft:#163246;--good:#4cc38a;--warn:#f0a443;--warn-soft:#3a2a12;--bad:#f97066;
    --bar:#4fb3e0;--bar-2:#2c6a89;
  }
}
:root[data-theme="dark"]{
  --bg:#0f141a;--surface:#161d25;--surface-2:#1d2630;--text:#e6ebf0;--muted:#9aa7b4;--border:#2a3540;

.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}

@media print{header,nav,section.tab:not(#t-results){display:none!important}section.tab{border:none}#t-results{display:block!important}body{background:#fff;color:#000}}

<header>

<script>
"use strict";
/* ===================== Example (illustrative only) ===================== */
const EXAMPLE = {
  "_note":"مثال توضيحي فقط — كل الأسعار والإنتاجيات افتراضية ويجب استبدالها بعروض موردين وسجلات الشركة.",
  "project":{"name":"مثال: إحلال شبكة مياه وتوصيلات منزلية لحي سكني","location":"الرياض","currency":"ر.س","duration_months":8,"vat_rate":0.15,"working_days_per_month":26},
  "design":{"min_cover_m":1.0},
  "rates":{
    "excavation_m3":{"type":"equipment","key":"excavation","rate":14},
    "rock_excavation_m3":{"type":"equipment","key":"excavation","rate":65},
    "bedding_m3":{"type":"material","key":"sand","rate":55},
    "surround_m3":{"type":"material","key":"sand","rate":60},
    "backfill_m3":{"type":"equipment","key":"backfill","rate":12},
    "disposal_m3":{"type":"equipment","key":"disposal","rate":18},
    "shoring_m2":{"type":"equipment","key":"shoring","rate":22},
    "asphalt_m2":{"type":"subcontract","key":"asphalt","rate":70},
    "dewatering_m":{"type":"subcontract","key":"dewatering","rate":40},
    "testing_m":{"type":"subcontract","key":"testing","rate":6},
    "tape_m":{"type":"material","key":"sundries","rate":1.5}
  },
  "pipelines":[
    {"code":"W-01","description":"توريد وتمديد واختبار أنابيب HDPE PE100 SDR11 قطر 160 مم شاملاً الحفر والردم وإعادة الأسفلت","material":"HDPE","dn_mm":160,"od_m":0.16,"length_m":9500,"cover_m":1.2,"surface":"asphalt","rock_ratio":0,"ground_water":false,"pipe_rate_per_m":48,"fittings_allowance":0.08,"lay_crew_daily_cost":1450,"lay_equipment_daily_cost":450,"lay_productivity_m_day":220,"crews":2,"productivity_factors":[{"name":"العمل داخل حي مأهول","factor":0.75}]},
    {"code":"W-02","description":"توريد وتمديد واختبار أنابيب حديد دكتايل K9 قطر 400 مم شاملاً الحفر والتدعيم والردم وإعادة الأسفلت","material":"DI","dn_mm":400,"od_m":0.429,"length_m":2200,"cover_m":1.5,"surface":"asphalt","rock_ratio":0.15,"ground_water":false,"pipe_rate_per_m":520,"fittings_allowance":0.10,"lay_crew_daily_cost":1900,"lay_equipment_daily_cost":1600,"lay_productivity_m_day":60,"crews":1,"productivity_factors":[{"name":"العمل داخل حي مأهول","factor":0.8}]}
  ],
  "boq":[
    {"code":"HC-01","description":"توصيلة منزلية مياه قطر 32 مم بطول حتى 10 م شاملة صندوق العداد","unit":"عدد","qty":1400,"components":[
      {"type":"material","name":"سرج + محبس + أنبوب + صندوق عداد","key":"fittings","qty":1,"rate":340},
      {"type":"labor","name":"فني + عاملان","key":"labor","daily_cost":750,"productivity":5},
      {"type":"subcontract","name":"إعادة أسفلت/بلاط موضعي","key":"asphalt","qty":2.5,"rate":70}]},
    {"code":"V-01","description":"محبس بوابي قطر 400 مم داخل غرفة خرسانية شاملة الغطاء D400","unit":"عدد","qty":18,"components":[
      {"type":"material","name":"محبس بوابي DN400","key":"valves","qty":1,"rate":9800},
      {"type":"subcontract","name":"غرفة محبس خرسانية مع الغطاء","key":"chambers","qty":1,"rate":7500},
      {"type":"labor","name":"فرقة تركيب","key":"labor","daily_cost":1900,"productivity":1.5}]}
  ],
  "site_overheads":[
    {"name":"مدير مشروع","count":1,"monthly_cost":28000},
    {"name":"مهندس موقع","count":2,"monthly_cost":15000},
    {"name":"مساح + معدات مساحة","count":1,"monthly_cost":11000},
    {"name":"مسؤول سلامة","count":1,"monthly_cost":9000},
    {"name":"مسؤول جودة","count":1,"monthly_cost":10000},
    {"name":"سيارات الموقع","count":3,"monthly_cost":3500},
    {"name":"مكتب ومستودع الموقع","count":1,"monthly_cost":9000},
    {"name":"إدارة المرور والحواجز واللوحات","count":1,"monthly_cost":12000},
    {"name":"التعبئة والتسريح","lump_sum":60000},
    {"name":"مخططات حسب التنفيذ وبيانات GIS","lump_sum":45000},
    {"name":"رسوم وتصاريح الحفر (يُتحقق من مسؤوليتها)","lump_sum":50000}
  ],
  "markups":{"head_office":0.05,"finance":0.015,"bonds_insurance":0.012,"contingency":0.04,"profit":0.08}
};

/* ===================== Engine (mirrors water_assemblies.py + pricing_calc.py) ===================== */
const TYPES = {material:"مواد",labor:"عمالة",equipment:"معدات",subcontract:"مقاول باطن"};
const MARKUPS = {head_office:"المصاريف العامة للشركة",finance:"تكلفة التمويل",bonds_insurance:"الضمانات البنكية والتأمين",contingency:"المخاطر والطوارئ"};
const DEFAULT_DESIGN = {min_width_m:0.60,clearance_small_m:0.20,clearance_large_m:0.30,bedding_m:0.15,surround_above_m:0.30,min_cover_m:1.00,shoring_depth_m:1.50,deep_trench_m:4.00,bulking:1.25,asphalt_overlap_m:0.30,pipe_waste:0.02};
const DESIGN_LABELS = {min_width_m:"أقل عرض للخندق (م)",clearance_small_m:"خلوص جانبي DN≤300 (م)",clearance_large_m:"خلوص جانبي DN>300 (م)",bedding_m:"سماكة الفرشة (م)",surround_above_m:"التغليف فوق الظهر (م)",min_cover_m:"الغطاء الأدنى (م)",shoring_depth_m:"عمق بدء التدعيم (م)",deep_trench_m:"عمق الخندق الخاص (م)",bulking:"معامل الانتفاش",asphalt_overlap_m:"تجاوز الأسفلت لكل جانب (م)",pipe_waste:"هالك الأنابيب"};
const RATE_KEYS = {excavation_m3:"حفر خندق (م³)",rock_excavation_m3:"حفر صخري (م³)",bedding_m3:"فرشة (م³)",surround_m3:"تغليف (م³)",backfill_m3:"ردم ودمك (م³)",disposal_m3:"نقل فائض (م³ مفكك)",shoring_m2:"تدعيم (م²)",asphalt_m2:"قص وإعادة أسفلت (م²)",dewatering_m:"نزح مياه (م.ط)",testing_m:"اختبار وتطهير (م.ط)",tape_m:"شريط تحذيري (م.ط)"};
const NORMS = [["HDPE",0,160,150,300],["HDPE",161,400,80,150],["DI",0,300,80,150],["DI",301,600,40,80],["DI",601,1200,20,40],["GRP",301,600,40,80],["GRP",601,1600,20,40],["UPVC",0,400,50,100]];
const FLEXIBLE = new Set(["HDPE","GRP","UPVC","PVC"]);
const r4 = x => Math.round(x*1e4)/1e4, r3 = x => Math.round(x*1e3)/1e3, r2 = x => Math.round(x*100)/100;

function geometry(p,d){
  const od=+p.od_m, clearance = (+p.dn_mm<=300)?d.clearance_small_m:d.clearance_large_m;
  const width=Math.max(d.min_width_m, od+2*clearance), depth=(+p.cover_m)+od+d.bedding_m;
  const pipeA=Math.PI*od*od/4, exc=width*depth, bed=width*d.bedding_m, sur=width*(od+d.surround_above_m)-pipeA;
  const backfill=exc-bed-sur-pipeA, imp=p.import_backfill?backfill:0;
  const rock=exc*(+p.rock_ratio||0);
  return {width,depth,excavation:exc-rock,rock,bedding:bed,surround:sur,backfill,
    disposal:(pipeA+bed+sur+imp)*d.bulking, shoring: depth>d.shoring_depth_m?2*depth:0,
    asphalt: p.surface==="asphalt"? width+2*d.asphalt_overlap_m:0};
}
function prodFactor(p){return (p.productivity_factors||[]).reduce((a,f)=>a*(+f.factor||1),1);}
function buildPipeItem(p,rates,d,missing){
  const g=geometry(p,d), f=prodFactor(p), eff=r3(p.lay_productivity_m_day*f), comps=[];
  comps.push({type:"material",name:`أنبوب ${p.material} DN${p.dn_mm}`,key:"pipe",qty:1,rate:+p.pipe_rate_per_m,waste:(p.pipe_waste??d.pipe_waste)});
  if(+p.fittings_allowance) comps.push({type:"material",name:"قطع ووصلات (نسبة من سعر الأنبوب)",key:"pipe",qty:+p.fittings_allowance,rate:+p.pipe_rate_per_m});
  comps.push({type:"labor",name:"فرقة التمديد والوصل",key:"labor",daily_cost:+p.lay_crew_daily_cost,productivity:eff});
  if(+p.lay_equipment_daily_cost) comps.push({type:"equipment",name:"معدات التمديد (رفع/لحام)",key:"equipment",daily_cost:+p.lay_equipment_daily_cost,productivity:eff});
  const rows=[["excavation_m3","حفر خندق",g.excavation],["rock_excavation_m3","حفر صخري",g.rock],["bedding_m3","فرشة رملية",g.bedding],["surround_m3","تغليف بمادة مختارة",g.surround],["backfill_m3","ردم ودمك على طبقات",g.backfill],["disposal_m3","نقل الفائض للمرادم المعتمدة",g.disposal],["shoring_m2","تدعيم جوانب الخندق",g.shoring],["asphalt_m2","قص وإعادة الأسفلت وطبقة الأساس",g.asphalt],["dewatering_m","نزح المياه الجوفية",p.ground_water?1:0],["testing_m","اختبار الضغط والتطهير",1],["tape_m","شريط تحذيري كاشف",1]];
  for(const [k,name,q] of rows){
    if(!(k in rates)){missing.add(`${k} (مطلوب للبند ${p.code})`);continue;}
    if(q<=0) continue;
    const r=rates[k]; comps.push({type:r.type||"subcontract",name,key:r.key||k,qty:r4(q),rate:+r.rate});
  }
  return {item:{code:p.code,description:p.description,unit:"م.ط",qty:+p.length_m,components:comps},g,f};
}
function pipeChecks(p,g,d,f,proj){
  const w=[], mat=String(p.material).toUpperCase();
  if(+p.cover_m<d.min_cover_m) w.push(`الغطاء ${p.cover_m} م أقل من الحد الأدنى ${d.min_cover_m} م — حماية خرسانية أو تأكيد من المواصفة.`);
  if(g.depth>d.deep_trench_m) w.push(`عمق الخندق ${g.depth.toFixed(2)} م > ${d.deep_trench_m} م — يتطلب تصميم تدعيم خاص ودراسة سلامة.`);
  if(g.shoring) w.push(`التدعيم محمّل لأن العمق ${g.depth.toFixed(2)} م > ${d.shoring_depth_m} م.`);
  if(p.ground_water) w.push("مياه جوفية: تأكد من طريقة النزح وتأثيرها على الإنتاجية (معامل التعديل).");
  if(FLEXIBLE.has(mat)) w.push("أنبوب مرن: جودة الفرشة والتغليف والدمك حاسمة لمنع الانبعاج — راجع متطلبات المصنع.");
  const eff=p.lay_productivity_m_day*f;
  for(const [m,lo_dn,hi_dn,lo,hi] of NORMS){ if(mat===m && +p.dn_mm>=lo_dn && +p.dn_mm<=hi_dn){ if(!(eff>=lo*0.6 && eff<=hi*1.2)) w.push(`إنتاجية التمديد الفعلية ${eff.toFixed(0)} م/يوم بعيدة عن النطاق الإرشادي ${lo}–${hi} م/يوم.`); break; } }
  const crews=+p.crews||1, days=p.length_m/(eff*crews), avail=(proj.duration_months||0)*(proj.working_days_per_month||26);
  if(avail && days>avail*0.7) w.push(`مدة التمديد ${days.toFixed(0)} يوم عمل بـ ${crews} فرقة تتجاوز 70% من المدة المتاحة (${avail} يوم) — زِد الفرق وحمّل تكلفتها أو راجع البرنامج.`);
  return {w,days,crews};
}
function expand(src){
  const d={...DEFAULT_DESIGN,...(src.design||{})}, rates=src.rates||{}, missing=new Set(), gen=[], geo=[];
  for(const p of (src.pipelines||[])){const {item,g,f}=buildPipeItem(p,rates,d,missing); gen.push(item); geo.push({p,g,f,...pipeChecks(p,g,d,f,src.project)});}
  return {priced:{project:src.project,boq:[...gen,...(src.boq||[])],site_overheads:src.site_overheads||[],markups:src.markups||{}},geo,missing:[...missing].sort(),design:d};
}
function compCost(c){ const base = ("productivity" in c) ? (c.productivity>0? c.daily_cost/c.productivity : NaN) : c.qty*c.rate; return base*(1+(+c.waste||0)); }
function itemUnit(item,ov){ const b={material:0,labor:0,equipment:0,subcontract:0}; for(const c of item.components||[]){ let x=compCost(c); if(ov && c.key in ov) x*=1+ov[c.key]; b[c.type]=(b[c.type]||0)+x; } return {unit:Object.values(b).reduce((a,v)=>a+v,0),b}; }
function price(proj,ov){
  let direct=0; const items=(proj.boq||[]).map(it=>{const {unit,b}=itemUnit(it,ov); const t=unit*it.qty; direct+=t; return {...it,direct_unit:unit,breakdown:b,direct_total:t};});
  let site=0; const siteRows=(proj.site_overheads||[]).map(o=>{const a=("monthly_cost" in o)?(o.count??1)*o.monthly_cost*(o.months??proj.project.duration_months):+o.lump_sum; site+=a; return [o.name,a];});
  const pc=direct+site, m=proj.markups||{}, mk=Object.keys(MARKUPS).map(k=>[MARKUPS[k],pc*(+m[k]||0)]);
  const tc=pc+mk.reduce((a,x)=>a+x[1],0), profit=tc*(+m.profit||0), bid=tc+profit, vatRate=proj.project.vat_rate??0.15;
  const factor=direct?bid/direct:0; let sum=0;
  for(const it of items){it.unit_price=r2(it.direct_unit*factor); it.total_price=r2(it.unit_price*it.qty); sum+=it.total_price;}
  return {items,direct,site,siteRows,pc,mk,tc,profit,bid,sum,vatRate,vat:bid*vatRate,factor};
}
function sanity(proj,r){
  const w=[], s=r.direct?r.site/r.direct:0;
  if(!(s>=0.08&&s<=0.15)) w.push(`مصاريف الموقع من التكلفة المباشرة = ${(s*100).toFixed(1)}% خارج النطاق المعتاد (8% – 15%). راجع الحساب التفصيلي.`);
  const m=proj.markups||{}, R={head_office:[0.03,0.07,"المصاريف العامة للشركة"],contingency:[0.02,0.10,"المخاطر والطوارئ"],profit:[0.05,0.15,"الربح"]};
  for(const k in R){const v=+m[k]||0; if(!(v>=R[k][0]&&v<=R[k][1])) w.push(`نسبة ${R[k][2]} = ${+(v*100).toFixed(2)}% خارج النطاق المعتاد (${R[k][0]*100}% – ${R[k][1]*100}%).`);}
  for(const it of r.items){ if(!(it.direct_unit>0)) w.push(`البند ${it.code} بدون تكلفة صحيحة — تأكد من تسعيره (أو إنتاجية = صفر).`); }
  return w;
}
function sensitivity(proj,base,delta){
  const keys=[...new Set((proj.boq||[]).flatMap(i=>(i.components||[]).map(c=>c.key).filter(Boolean)))];
  return keys.map(k=>[k,price(proj,{[k]:delta}).bid-base.bid]).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1]));
}

   </tbody></table></div></div>
  </div>
  <h2>جدول الكميات المسعّر وتحليل أسعار البنود</h2>
  <div class="tw"><table><thead><tr><th>البند</th><th>الوصف</th><th>الوحدة</th><th class="n">الكمية</th>${Object.values(TYPES).map(t=>`<th class="n">${t}</th>`).join("")}<th class="n">التكلفة المباشرة</th><th class="n">سعر الوحدة</th><th class="n">الإجمالي</th></tr></thead><tbody>
   ${r.items.map(it=>`<tr><td>${esc(it.code)}</td><td>${esc(it.description)}</td><td>${esc(it.unit)}</td><td class="n">${fmt(it.qty,2)}</td>${Object.keys(TYPES).map(t=>`<td class="n">${fmt(it.breakdown[t]||0)}</td>`).join("")}<td class="n">${fmt(it.direct_unit)}</td><td class="n"><b>${fmt(it.unit_price)}</b></td><td class="n">${fmt(it.total_price)}</td></tr>`).join("")}
   <tr class="total"><td colspan="${7+Object.keys(TYPES).length-1}">الإجمالي قبل الضريبة</td><td class="n">${fmt(r.sum)}</td></tr>
  </tbody></table></div>
  <div class="two">
   <div><h2>تحليل باريتو (أين تتركز القيمة)</h2><div class="tw"><table><thead><tr><th>البند</th><th class="n">الإجمالي</th><th class="n">النسبة</th><th class="n">التراكمي</th><th>الفئة</th></tr></thead><tbody>
    ${sorted.map(it=>{const prev=cum; cum+=it.total_price; const cls=prev/r.sum<0.8?"A":(prev/r.sum<0.95?"B":"C"); return `<tr><td>${esc(it.code)}</td><td class="n">${fmt(it.total_price,0)}</td><td class="n">${pct(it.total_price,r.sum)}</td><td class="n">${pct(cum,r.sum)}</td><td><span class="tag">${cls}</span></td></tr>`;}).join("")}
   </tbody></table></div><p class="note">بنود الفئة A تستحق تدقيق الكميات و3 عروض أسعار على الأقل.</p></div>
   <div><h2>تحليل الحساسية (±<input type="number" step="1" style="width:60px" value="${DELTA*100}" onchange="DELTA=(+this.value||10)/100;renderResults()">% على تكلفة المورد)</h2><div class="tw"><table><thead><tr><th>المورد (المفتاح)</th><th class="barcell"></th><th class="n">الأثر على العرض</th><th class="n">النسبة</th></tr></thead><tbody>
    ${sens.map(([k,d])=>`<tr><td>${esc(k)}</td><td class="barcell"><div class="bar b2" style="width:${(Math.abs(d)/maxS*100).toFixed(1)}%"></div></td><td class="n">±${fmt(Math.abs(d),0)}</td><td class="n">±${pct(Math.abs(d),bid)}</td></tr>`).join("")}
   </tbody></table></div></div>
  </div>
  <h2>مصاريف الموقع</h2><div class="tw"><table><tbody>${r.siteRows.map(([n,a])=>`<tr><td>${esc(n)}</td><td class="n">${fmt(a)}</td></tr>`).join("")}<tr class="total"><td>الإجمالي</td><td class="n">${fmt(r.site)}</td></tr></tbody></table></div>
  <p class="note">كل الأسعار غير شاملة الضريبة في الجدول. الأرقام من مدخلات المستخدم — راجع قائمة التحقق قبل التسليم.</p>`;
}

/* ===================== Wiring ===================== */
function renderAll(){ ({project:renderProject,rates:renderRates,pipes:renderPipes,boq:renderBoq,oh:renderOH,results:renderResults})[ACTIVE](); }
function changed(rerender){ save(); if(rerender) renderAll(); }
document.addEventListener("change",e=>{
  const t=e.target, p=t.dataset&&t.dataset.p; if(!p) return;
  const k=t.dataset.k; let v;
  if(k==="bool") v=t.checked; else if(k==="num"){ if(t.value===""){ v=undefined; } else { v=parseFloat(t.value); if(!Number.isFinite(v)) return; } } else v=t.value;
  if(v===undefined){ const ks=p.split("."), last=ks.pop(), parent=getPath(S,ks.join(".")); if(parent) delete parent[last]; } else setPath(S,p,v);
  changed(true);
});
function download(name,text,type){const b=new Blob([text],{type}); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500);}
const slug=()=>(S.project.name||"project").replace(/[^\p{L}\p{N}]+/gu,"_").slice(0,40);
function exportSource(){download(slug()+".water.json",JSON.stringify(S,null,2),"application/json");}
function exportPriced(){const ex=expand(S); if(ex.missing.length){alert("أسعار ناقصة:\n"+ex.missing.join("\n")); return;} download(slug()+".priced_input.json",JSON.stringify(ex.priced,null,2),"application/json");}
function exportCSV(){
  const ex=expand(S); if(ex.missing.length){alert("أسعار ناقصة:\n"+ex.missing.join("\n")); return;}
  const r=price(ex.priced), q=s=>`"${String(s).replace(/"/g,'""')}"`;
  const lines=[["البند","الوصف","الوحدة","الكمية","التكلفة المباشرة للوحدة","سعر الوحدة","الإجمالي"].map(q).join(",")];
  r.items.forEach(it=>lines.push([it.code,it.description,it.unit,it.qty,r2(it.direct_unit),it.unit_price,it.total_price].map(q).join(",")));
  lines.push(""); lines.push(["","الإجمالي قبل الضريبة","","","","",r2(r.sum)].map(q).join(","));
  lines.push(["",`ضريبة القيمة المضافة ${r.vatRate*100}%`,"","","","",r2(r.sum*r.vatRate)].map(q).join(","));
  lines.push(["","الإجمالي شامل الضريبة","","","","",r2(r.sum*(1+r.vatRate))].map(q).join(","));
  download(slug()+".priced_boq.csv","﻿"+lines.join("\r\n"),"text/csv;charset=utf-8");
}
document.getElementById("file").addEventListener("change",e=>{
  const f=e.target.files[0]; if(!f) return; const rd=new FileReader();
  rd.onload=()=>{ try{ const d=JSON.parse(rd.result); if(!d.project) throw new Error("الملف لا يحتوي على project"); d.boq=d.boq||[]; d.pipelines=d.pipelines||[]; d.rates=d.rates||{}; d.site_overheads=d.site_overheads||[]; d.markups=d.markups||{}; S=d; changed(true); go("results"); }catch(err){ alert("تعذر قراءة الملف: "+err.message); } };
  rd.readAsText(f,"utf-8"); e.target.value="";
});
function resetExample(){ if(confirm("استبدال البيانات الحالية بالمثال التوضيحي؟")){ S=clone(EXAMPLE); changed(true); } }
function toggleTheme(){const h=document.documentElement; const dark=h.dataset.theme? h.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches; h.dataset.theme=dark?"light":"dark";}
renderTabs(); renderAll();
</script>
