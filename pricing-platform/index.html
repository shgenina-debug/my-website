<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>منصة التسعير الهندسي</title>
<style>
:root{
  --bg:#f6f7f9;--surface:#fff;--surface-2:#f0f2f5;--text:#16202b;--muted:#5b6876;--border:#dde2e8;
  --accent:#0b6e99;--accent-soft:#e3f1f8;--good:#1f7a4d;--warn:#a35c00;--warn-soft:#fff4e0;--bad:#b42318;
  --bar:#0b6e99;--bar-2:#7fb7d1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f141a;--surface:#161d25;--surface-2:#1d2630;--text:#e6ebf0;--muted:#9aa7b4;--border:#2a3540;
    --accent:#4fb3e0;--accent-soft:#163246;--good:#4cc38a;--warn:#f0a443;--warn-soft:#3a2a12;--bad:#f97066;
    --bar:#4fb3e0;--bar-2:#2c6a89;
  }
}
:root[data-theme="dark"]{
  --bg:#0f141a;--surface:#161d25;--surface-2:#1d2630;--text:#e6ebf0;--muted:#9aa7b4;--border:#2a3540;
  --accent:#4fb3e0;--accent-soft:#163246;--good:#4cc38a;--warn:#f0a443;--warn-soft:#3a2a12;--bad:#f97066;
  --bar:#4fb3e0;--bar-2:#2c6a89;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 "Segoe UI",Tahoma,"Noto Sans Arabic",system-ui,sans-serif}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0}
header .sub{color:var(--muted);font-size:12px}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
button{background:var(--surface-2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font:inherit;cursor:pointer}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button.ghost{background:transparent}
button.del{color:var(--bad);background:transparent;border-color:transparent;padding:2px 6px}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 16px 0;background:var(--bg)}
nav button{border-radius:6px 6px 0 0;border-bottom:none;white-space:nowrap}
nav button.on{background:var(--surface);color:var(--accent);font-weight:600}
main{padding:0 16px 40px}
section.tab{display:none;background:var(--surface);border:1px solid var(--border);border-radius:0 0 8px 8px;padding:16px}
section.tab.on{display:block}
h2{font-size:15px;margin:18px 0 8px}
h2:first-child{margin-top:0}
h3{font-size:14px;margin:14px 0 6px;color:var(--accent)}
.note{color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
input,select{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:5px;padding:5px 7px;font:inherit;min-width:0;width:100%}
input[type=checkbox]{width:auto}
input.missing{border-color:var(--bad);background:var(--warn-soft)}
.tw{overflow-x:auto;border:1px solid var(--border);border-radius:6px;margin:6px 0 12px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--border);text-align:right;vertical-align:middle}
th{background:var(--surface-2);font-weight:600;white-space:nowrap}
td.n,th.n{text-align:left;direction:ltr;font-variant-numeric:tabular-nums;white-space:nowrap}
td input{min-width:70px}
td input.wide{min-width:240px}
tr.total td{font-weight:700;background:var(--surface-2)}
tr.sec td{background:var(--accent-soft);color:var(--accent);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:10px}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:18px;font-weight:700;direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
.warn{background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:8px 10px;margin:4px 0;font-size:13px}
.err{background:var(--warn-soft);color:var(--bad);border-radius:6px;padding:8px 10px;margin:4px 0}
.barcell{min-width:140px}
.bar{height:10px;background:var(--bar);border-radius:3px}
.bar.b2{background:var(--bar-2)}
.item{border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:10px}
.item .head{display:grid;grid-template-columns:90px 1fr 80px 110px auto;gap:8px;align-items:end}
.tag{display:inline-block;padding:1px 6px;border-radius:4px;background:var(--accent-soft);color:var(--accent);font-size:11px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chips button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.two>div{min-width:0}
.sticky-actions{position:sticky;bottom:0;background:var(--surface);padding:8px 0;border-top:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toast{position:fixed;bottom:16px;left:16px;right:16px;margin:auto;max-width:520px;background:var(--text);color:var(--bg);padding:10px 14px;border-radius:8px;z-index:20;white-space:pre-line}
.ask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}
.ask[hidden],.toast[hidden]{display:none}
.ask .box{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;max-width:420px;width:100%}
@media (max-width:760px){.two{grid-template-columns:minmax(0,1fr)}.item .head{grid-template-columns:1fr 1fr}}
@media print{header,nav,.sticky-actions,section.tab:not(#t-results){display:none!important}section.tab{border:none}#t-results{display:block!important}body{background:#fff;color:#000}}
</style>
</head>

<header>
  <div>
    <h1>منصة التسعير الهندسي</h1>
    <div class="sub">اختر نوع المشروع ← بنود التخصص من المكتبة ← تفكيك كل بند ← أسعار الموارد ← العرض والتحليل</div>
  </div>
  <div class="toolbar">
    <button class="primary" onclick="newProject()">＋ مشروع جديد</button>
    <button onclick="document.getElementById('file').click()">📂 استيراد JSON</button>
    <input id="file" type="file" accept=".json,application/json" hidden>
    <button onclick="exportSource()">💾 حفظ المشروع</button>
    <button onclick="exportPriced()">⬇️ ملف للحاسبة</button>
    <button onclick="exportCSV()">⬇️ CSV</button>
    <button onclick="window.print()">🖨️ طباعة</button>
    <select id="exsel" style="width:auto;max-width:190px" onchange="loadExample(this.value);this.value=''"><option value="">↺ الأمثلة…</option></select>
    <button class="ghost" onclick="toggleTheme()">🌓 الوضع</button>
  </div>
</header>
<div id="toast" class="toast" role="status" hidden></div>
<div id="ask" class="ask" hidden><div class="box"><p></p><div class="extra"></div><div class="toolbar"><button class="primary yes">موافق</button><button class="no">إلغاء</button></div></div></div>
<nav id="tabs"></nav>
<main>
  <section class="tab" id="t-project"></section>
  <section class="tab" id="t-library"></section>
  <section class="tab" id="t-boq"></section>
  <section class="tab" id="t-resources"></section>
  <section class="tab" id="t-pipes"></section>
  <section class="tab" id="t-oh"></section>
  <section class="tab" id="t-results"></section>
</main>

function pipeChecks(p,g,d,f,proj){

  if(g.shoring) w.push(`التدعيم محمّل لأن العمق ${g.depth.toFixed(2)} م > ${d.shoring_depth_m} م.`);
  if(p.ground_water) w.push("مياه جوفية: تأكد من طريقة النزح وتأثيرها على الإنتاجية (معامل التعديل).");
  if(FLEXIBLE.has(mat)) w.push("أنبوب مرن: جودة الفرشة والتغليف والدمك حاسمة لمنع الانبعاج — راجع متطلبات المصنع.");
  const eff=p.lay_productivity_m_day*f;
  for(const [m,lo_dn,hi_dn,lo,hi] of NORMS){ if(mat===m && +p.dn_mm>=lo_dn && +p.dn_mm<=hi_dn){ if(!(eff>=lo*0.6 && eff<=hi*1.2)) w.push(`إنتاجية التمديد الفعلية ${eff.toFixed(0)} م/يوم بعيدة عن النطاق الإرشادي ${lo}–${hi} م/يوم.`); break; } }

    if(c.kind==="ratio"){ const num=c.num.reduce((a,i)=>a+(q[i]||0),0), den=c.den.reduce((a,i)=>a+(q[i]||0),0);
      if(num&&den){const v=num/den*(c.factor||1); if(!(v>=c.min&&v<=c.max)) out.push(`${c.label} = ${v.toFixed(0)} ${c.unit} خارج النطاق الإرشادي ${c.min}–${c.max}.`);} }
    else if(c.kind==="requires"){ if(c.if.some(i=>present.has(i)) && !c.then.some(i=>present.has(i))) out.push(c.msg); }
  }
  return out;
}
function expand(src){
  const d={...DEFAULT_DESIGN,...(src.design||{})}, missing=new Set(), items=[], dropped=[], geo=[], pipes=[];
  for(const it of (src.boq||[])){
    if(!+it.qty){dropped.push(it.code);continue;}
    const comps=(it.components||[]).map(c=>resolveComp(c,it.code,missing)).filter(Boolean);
    items.push({...it,components:comps,discipline:disciplineOf(it)});
  }
  for(const p of (src.pipelines||[])){const {item,g,f}=buildPipeItem(p,src.rates||{},d,missing); pipes.push(item); geo.push({p,g,f,...pipeChecks(p,g,d,f,src.project)});}
  return {priced:{project:src.project,boq:[...pipes,...items],site_overheads:src.site_overheads||[],markups:src.markups||{}},
    geo,missing:[...missing].sort(),design:d,dropped,checks:libChecks(src.boq||[])};
}
function compCost(c){ const base=("productivity" in c)?(c.productivity>0?c.daily_cost/c.productivity:NaN):c.qty*c.rate; return base*(1+(+c.waste||0)); }
function itemUnit(item,ov){ const b={material:0,labor:0,equipment:0,subcontract:0}; for(const c of item.components||[]){ let x=compCost(c); if(ov&&c.key in ov) x*=1+ov[c.key]; b[c.type]=(b[c.type]||0)+x; } return {unit:Object.values(b).reduce((a,v)=>a+v,0),b}; }
function price(proj,ov){
  let direct=0; const items=(proj.boq||[]).map(it=>{const {unit,b}=itemUnit(it,ov); const t=unit*it.qty; direct+=t; return {...it,direct_unit:unit,breakdown:b,direct_total:t};});
  let site=0; const siteRows=(proj.site_overheads||[]).map(o=>{const a=("monthly_cost" in o)?(o.count??1)*o.monthly_cost*(o.months??proj.project.duration_months):+o.lump_sum; site+=a; return [o.name,a];});
  const pc=direct+site, m=proj.markups||{}, mk=Object.keys(MARKUPS).map(k=>[MARKUPS[k],pc*(+m[k]||0)]);
  const tc=pc+mk.reduce((a,x)=>a+x[1],0), profit=tc*(+m.profit||0), bid=tc+profit, vatRate=proj.project.vat_rate??0.15;
  const factor=direct?bid/direct:0; let sum=0;
  for(const it of items){it.unit_price=r2(it.direct_unit*factor); it.total_price=r2(it.unit_price*it.qty); sum+=it.total_price;}
  return {items,direct,site,siteRows,pc,mk,tc,profit,bid,sum,vatRate,vat:bid*vatRate,factor};
}
function sanity(proj,r){
  const w=[], s=r.direct?r.site/r.direct:0;
  if(!(s>=0.08&&s<=0.15)) w.push(`مصاريف الموقع من التكلفة المباشرة = ${(s*100).toFixed(1)}% خارج النطاق المعتاد (8% – 15%). راجع الحساب التفصيلي.`);
  const m=proj.markups||{}, R={head_office:[0.03,0.07,"المصاريف العامة للشركة"],contingency:[0.02,0.10,"المخاطر والطوارئ"],profit:[0.05,0.15,"الربح"]};
  for(const k in R){const v=+m[k]||0; if(!(v>=R[k][0]&&v<=R[k][1])) w.push(`نسبة ${R[k][2]} = ${+(v*100).toFixed(2)}% خارج النطاق المعتاد (${R[k][0]*100}% – ${R[k][1]*100}%).`);}
  for(const it of r.items){ if(!(it.direct_unit>0)) w.push(`البند ${it.code} بدون تكلفة صحيحة — تأكد من تسعيره (أو إنتاجية = صفر).`); }
  return w;
}
function sensitivity(proj,base,delta){
  const keys=[...new Set((proj.boq||[]).flatMap(i=>(i.components||[]).map(c=>c.key).filter(Boolean)))];
  return keys.map(k=>[k,price(proj,{[k]:delta}).bid-base.bid]).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1]));
}

/* hosted on claude.ai: save through the downloads capability; opened locally: plain link */
let DLP=null;
function dlNS(){ if(!DLP) DLP=(window.claude&&typeof window.claude.use==="function")?window.claude.use("downloads").catch(()=>null):Promise.resolve(undefined); return DLP; }
async function download(name,text,type){
  const ns=await dlNS();
  if(ns){ try{ await ns.save({filename:name,data:new Blob([text],{type})}); toast("تم حفظ الملف."); }
    catch(e){ if(e&&e.code==="declined") return; toast(e&&e.code==="rate_limited"?"هناك نافذة حفظ مفتوحة بالفعل، حاول بعد لحظات.":"الحفظ غير متاح في هذا العرض."); } return; }
  if(ns===null){ toast("الحفظ غير متاح في هذا العرض."); return; }
  const b=new Blob([text],{type}); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500);
}
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>{t.hidden=true;},6000); }
function ask(msg,extra=""){ return new Promise(res=>{ const d=document.getElementById("ask"); d.querySelector("p").textContent=msg; d.querySelector(".extra").innerHTML=extra; d.hidden=false;
  const done=v=>{d.hidden=true; d.querySelector(".yes").onclick=d.querySelector(".no").onclick=null; res(v);};
  d.querySelector(".yes").onclick=()=>done(true); d.querySelector(".no").onclick=()=>done(false); }); }

  const r=price(ex.priced), q=s=>`"${String(s).replace(/"/g,'""')}"`;
  const lines=[["البند","الوصف","الوحدة","الكمية","التكلفة المباشرة للوحدة","سعر الوحدة","الإجمالي"].map(q).join(",")];
  r.items.forEach(it=>lines.push([it.code,it.description,it.unit,it.qty,r2(it.direct_unit),it.unit_price,it.total_price].map(q).join(",")));
  lines.push(""); lines.push(["","الإجمالي قبل الضريبة","","","","",r2(r.sum)].map(q).join(","));
  lines.push(["",`ضريبة القيمة المضافة ${r.vatRate*100}%`,"","","","",r2(r.sum*r.vatRate)].map(q).join(","));
  lines.push(["","الإجمالي شامل الضريبة","","","","",r2(r.sum*(1+r.vatRate))].map(q).join(","));
  download(slug()+".priced_boq.csv","﻿"+lines.join("\r\n"),"text/csv;charset=utf-8");
}
document.getElementById("file").addEventListener("change",e=>{
  const f=e.target.files[0]; if(!f) return; const rd=new FileReader();
  rd.onload=()=>{ try{ const d=JSON.parse(rd.result); if(!d.project) throw new Error("الملف لا يحتوي على project"); S=normalize(d); changed(); go("results"); }catch(err){ toast("تعذر قراءة الملف: "+err.message); } };
  rd.readAsText(f,"utf-8"); e.target.value="";
});
async function newProject(){
  const extra=`<label class="f">اسم المشروع<input id="np-name" type="text" value=""></label><label class="f" style="margin-top:8px">نوع المشروع<select id="np-type">${Object.entries(typeOptions()).map(([k,l])=>`<option value="${k}">${esc(l)}</option>`).join("")}</select></label><p class="note">سيتم استبدال المشروع الحالي — احفظه أولاً إن احتجته.</p>`;
  const p=ask("مشروع جديد",extra); const nm=document.getElementById("np-name"); nm.focus();
  if(!(await p)) return; const type=document.getElementById("np-type").value;
  S=normalize(blank(type,document.getElementById("np-name").value.trim()||"مشروع جديد")); LIBSEL={disc:null,all:false,q:{}}; changed(); go("library");
}
async function loadExample(k){ if(!k) return; if(await ask(`تحميل المثال «${EXAMPLES[k].project.name}» بدلاً من المشروع الحالي؟`)){ S=normalize(clone(EXAMPLES[k])); changed(); go("results"); } }
document.getElementById("exsel").insertAdjacentHTML("beforeend",Object.entries(EXAMPLES).map(([k,e])=>`<option value="${k}">${esc(e.project.name)}</option>`).join(""));
function toggleTheme(){const h=document.documentElement; const dark=h.dataset.theme? h.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches; h.dataset.theme=dark?"light":"dark";}
renderAll();
</script>
